name: Outbound persistence canary

on:
  push:
    branches: [main]
    paths:
      - ".github/outbound-persistence-trigger"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: outbound-persistence-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      OUTBOUND_PERSISTENCE_MODE: CANARY
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard — no customer send path
        run: |
          set -euo pipefail
          ! grep -q "messages().send" outbound_persistence.py
          ! grep -q "gmail.send" outbound_persistence.py
          ! grep -q "send_message" outbound_persistence.py
          echo "Persistence backend contains no customer-email send path."

      - name: Authenticate Google Sheets
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check google-auth==2.36.0 google-api-python-client==2.154.0 pytest==8.3.4

      - name: Persistence integrity tests
        run: |
          python -m compileall outbound_persistence.py
          pytest -q tests/test_outbound_persistence.py

      - name: Google Sheets persistence canary
        run: python outbound_persistence.py
