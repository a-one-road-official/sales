name: Form production executor

on:
  push:
    branches: [main]
    paths:
      - ".github/form-production-trigger"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: form-production-executor
  cancel-in-progress: false

jobs:
  form-production:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      LEAD_FACTORY_SHEETS_READ_MIN_INTERVAL_SECONDS: "0.25"
      LEAD_FACTORY_SHEETS_WRITE_MIN_INTERVAL_SECONDS: "0.25"
      OUTREACH_FORM_ACTION_TIMEOUT_MS: "12000"
      FORM_PRODUCTION_SHARD_COUNT: "4"
      FORM_PRODUCTION_SHARD_INDEX: "${{ matrix.shard }}"
      OUTREACH_EVIDENCE_DIR: "form-production-evidence-${{ matrix.shard }}"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: form-playwright-${{ runner.os }}-1.49.1-chromium

      - name: Guard — deterministic form only
        run: |
          set -euo pipefail
          ! grep -q "messages().send" form_production.py
          ! grep -q "gmail.send" form_production.py
          ! grep -q "openai" form_production.py
          ! grep -q "vertex" form_production.py
          ! grep -q "gemini" form_production.py
          echo "Production form executor contains no email/model send path."

      - name: Authenticate Google Sheets
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install deterministic browser runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements-form.txt
          python -m playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install chromium
          fi

      - name: Form resilience tests
        run: |
          python -m compileall form_execution.py form_production.py
          pytest -q tests/test_form_execution_resilience.py

      - name: Execute ChatGPT-claimed form jobs
        run: python form_production.py

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-production-evidence-${{ github.run_id }}-${{ matrix.shard }}
          path: form-production-evidence-${{ matrix.shard }}/
          if-no-files-found: ignore
          retention-days: 7
