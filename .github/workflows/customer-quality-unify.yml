name: Customer quality consolidation (one shot)
on:
  push:
    branches: ['customer-first/ssot-quality-20260920']
    paths: ['.github/workflows/customer-quality-unify.yml']
permissions:
  contents: write
concurrency:
  group: customer-first-one-shot-integration
  cancel-in-progress: false
jobs:
  consolidate:
    if: startsWith(github.event.head_commit.message, 'UNIFY_CUSTOMER_QUALITY_20260920')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LEAD_FACTORY_VERTEX_ALLOWED: FALSE
      LEAD_FACTORY_PAID_AI_ALLOWED: FALSE
      LEAD_FACTORY_PAID_CLOUD_ALLOWED: FALSE
      LEAD_FACTORY_ALLOW_EXTERNAL_WRITE: FALSE
      LEAD_FACTORY_SEND_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer-first/ssot-quality-20260920
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse the exact deployed SSOT implementation and apply only customer checks
        run: |
          git config user.name 'a-one-road-official'
          git config user.email 'admin@a1-road.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'a0ac9d58ef23efed6ce844cbbdea7988a684c86d'
          git merge --no-edit origin/main
          git checkout origin/main -- sales_leads_sacrifice_run.py outreach_cycle.py
          python tools/unify_customer_quality.py
          python cost_guard.py
          python -m compileall -q .
      - name: Install existing test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run all regressions against the deployed SSOT and form execution
        run: pytest -q
      - name: Commit tested consolidation and remove its one-shot files
        run: |
          rm tools/unify_customer_quality.py tools/customer_quality_source.txt .github/workflows/customer-quality-unify.yml
          git add customer_care.py customer_sheet.py form_execution.py outreach_master.py sales_history.py sales_leads_sacrifice_run.py outreach_cycle.py ssot_terminal.py tests/test_customer_care.py tests/test_customer_sheet.py tests/test_customer_contract.py tests/test_customer_quality.py tests/test_ssot_terminal.py docs/CUSTOMER_FIRST_OPERATIONS.md docs/SSOT_SALES_TERMINAL.md tools/unify_customer_quality.py tools/customer_quality_source.txt .github/workflows/customer-quality-unify.yml
          git commit -m 'Use one deployed SSOT terminal with tested customer-quality checks'
          git push origin HEAD:customer-first/ssot-quality-20260920
          echo 'Single SSOT engine reused; all regressions passed; customer sends=0; live data writes=0; one-shot files removed.' >> "$GITHUB_STEP_SUMMARY"
