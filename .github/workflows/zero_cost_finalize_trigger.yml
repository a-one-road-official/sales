name: Trigger zero-cost finalize deploy
on:
  push:
    branches: [main]
    paths:
      - ".ops/zero-cost-finalize-trigger"
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical paused deploy on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy_paused_repair.yml/dispatches" -f ref=main
