name: LIST ONLY - disabled outbound workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm list-only mode
        run: |
          echo "List-only mode is enforced."
          echo "No customer-facing sends, forms, invitations, or CRM notifications are performed."
