name: Continuous SSOT outbound

on:
  push:
    branches: [main]
    paths:
      - ".github/outbound-continuous-start"

permissions:
  contents: write
  id-token: write

concurrency:
  group: continuous-ssot-outbound
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      LEAD_FACTORY_GMAIL_SIGNING_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      LEAD_FACTORY_TASKS_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Google
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check google-auth google-api-python-client

      - name: Run continuously until STOP, target reached, or chain handoff
        id: worker
        shell: bash
        run: |
          set +e
          python continuous_ssot_sender.py --seconds 20400 --idle-sleep 15 --send-burst 25
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Chain next continuous run when still START
        if: steps.worker.outputs.exit_code == '75'
        shell: bash
        run: |
          set -euo pipefail
          printf 'continue %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/outbound-continuous-start
          git config user.name "a-one-road-official"
          git config user.email "admin@a1-road.com"
          git add .github/outbound-continuous-start
          git commit -m "Continue continuous outbound" || exit 0
          git push origin HEAD:main
