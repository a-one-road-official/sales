name: Customer-first final regression
on:
  push:
    branches: ['customer-first/ssot-quality-20260920']
    paths: ['.github/workflows/customer-first-finalize.yml']
permissions:
  contents: write
concurrency:
  group: customer-first-one-shot-integration
  cancel-in-progress: false
jobs:
  finalize:
    if: startsWith(github.event.head_commit.message, 'FINALIZE_CUSTOMER_FIRST_20260920')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LEAD_FACTORY_VERTEX_ALLOWED: FALSE
      LEAD_FACTORY_PAID_AI_ALLOWED: FALSE
      LEAD_FACTORY_PAID_CLOUD_ALLOWED: FALSE
      LEAD_FACTORY_ALLOW_EXTERNAL_WRITE: FALSE
      LEAD_FACTORY_SEND_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer-first/ssot-quality-20260920
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic compatibility patches
        run: |
          python cost_guard.py
          python tools/finalize_customer_first.py
          cat tools/customer_registration_fragment.txt >> customer_sheet.py
          python tools/customer_contract_finish.py
          python -m compileall -q .
      - name: Install existing test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run all customer and legacy regressions
        run: pytest -q
      - name: Commit verified code and retire all temporary integration files
        run: |
          rm tools/finalize_customer_first.py tools/customer_registration_fragment.txt tools/customer_contract_finish.py .github/workflows/customer-first-finalize.yml
          git config user.name 'a-one-road-official'
          git config user.email 'admin@a1-road.com'
          git add customer_care.py customer_sheet.py sales_leads_sacrifice_run.py tools/finalize_customer_first.py tools/customer_registration_fragment.txt tools/customer_contract_finish.py .github/workflows/customer-first-finalize.yml
          git commit -m 'Verify customer-first SSOT contract and remove temporary integration entrypoint'
          git push origin HEAD:customer-first/ssot-quality-20260920
          echo 'Full regressions passed. No live credentials, customer sends, or production data writes. Temporary integration scripts removed.' >> "$GITHUB_STEP_SUMMARY"
