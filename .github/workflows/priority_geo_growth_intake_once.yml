name: Priority geo growth intake once

# Budget-sensitive Cloud Run intake is operator-only. Ordinary pushes can never
# start this workflow. Paid execution requires an explicit checkbox each run.
on:
  workflow_dispatch:
    inputs:
      confirm_paid_cloud:
        description: "I explicitly authorize this one bounded Cloud Run intake"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  intake:
    if: ${{ inputs.confirm_paid_cloud == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      SERVICE: aone-lead-factory
      A1_REPAIR_REVISION: 2026-09-16-A1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Keep recurring and customer-facing execution closed
        run: |
          set +e
          for JOB in $(gcloud scheduler jobs list --location="$REGION" --project="$PROJECT" --format='value(name)' --filter='name:lead-factory' | sed 's#.*/##'); do
            [ -n "$JOB" ] || continue
            gcloud scheduler jobs pause "$JOB" --location="$REGION" --project="$PROJECT" || true
          done
          for QUEUE in lead-factory-workers lead-factory-priority-workers; do
            gcloud tasks queues pause "$QUEUE" --location="$REGION" --project="$PROJECT" || true
          done

      - name: Resolve internal endpoint
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')"
          TOKEN="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format=json | python -c 'import json,sys; d=json.load(sys.stdin); e=d.get("spec",{}).get("template",{}).get("spec",{}).get("containers",[{}])[0].get("env",[]); print(next((x.get("value","") for x in e if x.get("name")=="LEAD_FACTORY_INTERNAL_TOKEN"), ""))')"
          test -n "$URL"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"
          echo "INTERNAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Temporarily authorize this bounded Cloud Run operation
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --update-env-vars=LEAD_FACTORY_PAID_CLOUD_ALLOWED=TRUE,LEAD_FACTORY_PAID_AI_ALLOWED=FALSE,LEAD_FACTORY_VERTEX_ALLOWED=FALSE,LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED=FALSE,LEAD_FACTORY_AUTONOMOUS_CAPACITY_EXPANSION=FALSE,LEAD_FACTORY_AUTO_ROLLOVER_DAILY_GOAL=FALSE,LEAD_FACTORY_ALLOW_HTTP_SELF_FALLBACK=FALSE >/dev/null

      - name: Register priority growth sources
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 180 \
            -X POST -H "X-Aone-Internal-Token: $INTERNAL_TOKEN" \
            -H "Content-Type: application/json" \
            "$SERVICE_URL/discover/growth" | tee /tmp/discover-growth.json

      - name: Run one bounded pass for Israel Taiwan Korea sources
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/priority-source-ids.txt
          import hashlib
          from source_universe import BOOTSTRAP_SOURCES, PRIORITY_GEOGRAPHIES
          from safety import canonicalize_url

          for source in BOOTSTRAP_SOURCES:
              if source.get("country") not in PRIORITY_GEOGRAPHIES:
                  continue
              if str(source.get("source_type", "")).startswith("MITTELSTAND_"):
                  continue
              url = canonicalize_url(source.get("exhibitor_directory_url") or source.get("source_url") or "")
              if not url:
                  continue
              sid = "source-" + hashlib.sha256(url.encode()).hexdigest()[:20]
              print(source.get("country"), sid, source.get("source_name"), sep="\t")
          PY

          # One attempt per source. Historical 3x retries could multiply Cloud Run work.
          while IFS=$'\t' read -r COUNTRY SOURCE_ID SOURCE_NAME; do
            [ -n "$SOURCE_ID" ] || continue
            echo "=== $COUNTRY :: $SOURCE_NAME :: $SOURCE_ID ==="
            timeout 240 curl --silent --show-error --fail-with-body \
              -X POST \
              -H "X-Aone-Internal-Token: $INTERNAL_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "$SERVICE_URL/source/$SOURCE_ID/run" || true
          done < /tmp/priority-source-ids.txt

      - name: Revoke paid-cloud authorization and keep everything paused
        if: ${{ always() }}
        run: |
          set +e
          gcloud run services update "$SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --min=0 --cpu-throttling \
            --update-env-vars=LEAD_FACTORY_PAID_CLOUD_ALLOWED=FALSE,LEAD_FACTORY_PAID_AI_ALLOWED=FALSE,LEAD_FACTORY_VERTEX_ALLOWED=FALSE,LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED=FALSE,LEAD_FACTORY_AUTONOMOUS_CAPACITY_EXPANSION=FALSE,LEAD_FACTORY_AUTO_ROLLOVER_DAILY_GOAL=FALSE,LEAD_FACTORY_ALLOW_HTTP_SELF_FALLBACK=FALSE >/dev/null || true
          for JOB in $(gcloud scheduler jobs list --location="$REGION" --project="$PROJECT" --format='value(name)' --filter='name:lead-factory' | sed 's#.*/##'); do
            [ -n "$JOB" ] || continue
            gcloud scheduler jobs pause "$JOB" --location="$REGION" --project="$PROJECT" || true
          done
          for QUEUE in lead-factory-workers lead-factory-priority-workers; do
            gcloud tasks queues pause "$QUEUE" --location="$REGION" --project="$PROJECT" || true
          done
