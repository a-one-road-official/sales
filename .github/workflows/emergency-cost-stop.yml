name: Explicit paid AI cost stop

# Maintenance pushes cannot execute this control. Existing cloud shutdown stays intact.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for disabling paid Google AI APIs'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: aone-paid-ai-cost-stop
  cancel-in-progress: false
jobs:
  stop:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reason != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      COST_STOP_REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Disable paid AI and verify both APIs
        run: python scripts/stop_paid_ai.py --project="$PROJECT"
