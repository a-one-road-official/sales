name: Non-AI lead intake

on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
  push:
    branches: [codex/non-ai-scheduled-intake]
    paths: [.github/workflows/non-ai-lead-intake.yml]

permissions:
  contents: read
  id-token: write

concurrency:
  group: aone-non-ai-dual-list-writer
  cancel-in-progress: false

jobs:
  intake:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AONE_FREE_PUBLIC_RUNNER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: pip install -r lead_generator/requirements.txt
      - name: Check controls and process a bounded batch
        run: python -m lead_generator.scheduled
      # No artifacts/cache upload: all journal data stays in the existing private sheet.
