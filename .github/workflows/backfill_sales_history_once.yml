name: Backfill SSOT sales history once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill_sales_history_once.yml"

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      LEAD_FACTORY_SPREADSHEET_ID: 1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo
      LEAD_FACTORY_GMAIL_IMPERSONATE: admin@a1-road.com
      LEAD_FACTORY_GMAIL_SIGNING_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      LEAD_FACTORY_TASKS_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      SALES_HISTORY_BACKFILL_AFTER: 2026/07/01

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Keep customer-facing execution closed
        run: |
          echo "This job reads Gmail Sent and writes internal SSOT history only."
          echo "No customer-facing send, form, invitation, or notification is executed."

      - name: Backfill durable sales history
        run: python backfill_sales_history.py
