name: Inspect deployed runtime readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspect_runtime_readiness.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Inspect routing, IAM and health responses without mutations
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -u
          SERVICE=aone-lead-factory
          REGION=asia-northeast1
          gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format=json > /tmp/service.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/service.json"))
          print(json.dumps({
              "annotations": d.get("metadata",{}).get("annotations",{}),
              "status": d.get("status",{}),
              "image": d.get("spec",{}).get("template",{}).get("spec",{}).get("containers",[{}])[0].get("image"),
          }, indent=2))
          PY

          echo "IAM policy:"
          gcloud run services get-iam-policy "$SERVICE" --region="$REGION" --project="$PROJECT" --format=json || true

          python - <<'PY' >/tmp/run_urls.txt
          import json
          d=json.load(open("/tmp/service.json"))
          urls=[]
          s=d.get("status",{})
          if s.get("url"): urls.append(s["url"])
          a=d.get("metadata",{}).get("annotations",{})
          try: urls.extend(json.loads(a.get("run.googleapis.com/urls","[]")))
          except Exception: pass
          seen=[]
          for u in urls:
              if u and u not in seen: seen.append(u)
          print("\n".join(seen))
          PY

          TOKEN="$(gcloud auth print-identity-token 2>/dev/null || true)"
          while IFS= read -r URL; do
            [ -n "$URL" ] || continue
            echo "=== unauthenticated $URL/healthz ==="
            curl -sS -D - -o /tmp/body --max-time 15 "$URL/healthz" || true
            cat /tmp/body 2>/dev/null || true
            echo
            if [ -n "$TOKEN" ]; then
              echo "=== authenticated $URL/healthz ==="
              curl -sS -D - -o /tmp/body-auth --max-time 15 -H "Authorization: Bearer $TOKEN" "$URL/healthz" || true
              cat /tmp/body-auth 2>/dev/null || true
              echo
            fi
          done </tmp/run_urls.txt
