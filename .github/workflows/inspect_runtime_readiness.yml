name: Inspect deployed runtime readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspect_runtime_readiness.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Read service routing and readiness without mutations
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud run services describe aone-lead-factory --region=asia-northeast1 --project="$PROJECT" --format=json > /tmp/service.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/service.json"))
          print(json.dumps({
              "annotations": {k:v for k,v in d.get("metadata",{}).get("annotations",{}).items() if any(x in k for x in ("ingress", "url", "default"))},
              "status": d.get("status",{}),
              "image": d.get("spec",{}).get("template",{}).get("spec",{}).get("containers",[{}])[0].get("image"),
          }, indent=2))
          PY
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="aone-lead-factory" AND resource.labels.revision_name="aone-lead-factory-00482-qf2"' --project="$PROJECT" --freshness=20m --limit=20 --format='table(timestamp,severity,httpRequest.status,textPayload)'
