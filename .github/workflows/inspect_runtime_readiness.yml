name: Reduce verified legacy standby minimum
run-name: Legacy standby reduction ${{ github.run_id }}
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect_runtime_readiness.yml"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: aone-readonly-runtime-inventory
  cancel-in-progress: false
jobs:
  reduce-standby:
    if: github.event.repository.private == false && startsWith(github.event.head_commit.message, 'REDUCE_LEGACY_STANDBY_20260920:')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Verify unchanged legacy targets and remove service-level warm minimum
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
        run: |
          python - <<'PY'
          import datetime,hashlib,json,os,pathlib,subprocess
          targets={'aone-lead-factory-approved-sacrifice':'aone-lead-factory-approved-sacrifice-00010-7dx','aone-lead-factory-sacrifice':'aone-lead-factory-sacrifice-00016-nm2'}
          report={'run_id':os.environ['GITHUB_RUN_ID'],'started_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'service-level minScale 1 to 0 only','results':[],'customer_sends':0,'model_calls':0}
          def command(args,timeout=30):
              return subprocess.run(['gcloud','run','services',*args,'--region=asia-northeast1','--project='+os.environ['PROJECT'],'--quiet','--format=json'],capture_output=True,text=True,timeout=timeout)
          def get(name):
              p=command(['describe',name])
              if p.returncode: raise RuntimeError('describe_failed:'+name+':'+p.stderr[-400:])
              return json.loads(p.stdout)
          def digest(d):return hashlib.sha256(json.dumps(d.get('spec'),sort_keys=True).encode()).hexdigest()
          before={}
          try:
              for name,revision in targets.items():
                  d=get(name);a=d['metadata'].get('annotations',{});t=d['spec']['template'];env={x['name']:x.get('value','') for c in t['spec']['containers'] for x in c.get('env',[])}
                  assert d['metadata']['name']==name and d['status']['latestReadyRevisionName']==revision,'revision_changed'
                  assert a.get('run.googleapis.com/minScale')=='1','standby_min_changed'
                  assert t.get('metadata',{}).get('annotations',{}).get('autoscaling.knative.dev/minScale','0')=='0','revision_min_requires_separate_review'
                  assert env.get('LEAD_FACTORY_ALLOW_EXTERNAL_WRITE')=='FALSE','external_writes_not_disabled'
                  assert env.get('LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED')=='FALSE','supervisor_not_disabled'
                  assert env.get('OUTREACH_AUTOPILOT_ENABLED','FALSE')=='FALSE','autopilot_not_disabled'
                  before[name]=d
              for name,revision in targets.items():
                  d=get(name)
                  assert digest(d)==digest(before[name]) and d['metadata']['generation']==before[name]['metadata']['generation'],'concurrent_change_detected'
                  item={'service':name,'before_min':1,'revision':revision,'before_spec_hash':digest(d)}
                  try:
                      p=command(['update',name,'--min=0'],timeout=100)
                      item['command_returncode']=p.returncode
                      if p.returncode:item['error']=p.stderr[-500:]
                  except Exception as e:item['error']=str(e)[:500]
                  after=get(name)
                  item['after_min']=int(after['metadata'].get('annotations',{}).get('run.googleapis.com/minScale','0'))
                  item['spec_unchanged']=digest(after)==digest(d)
                  item['revision_unchanged']=after['status']['latestReadyRevisionName']==revision
                  item['verified']=item['after_min']==0 and item['spec_unchanged'] and item['revision_unchanged']
                  item['verified_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
                  report['results'].append(item)
                  if not item['verified']:raise RuntimeError('readback_not_verified:'+name)
          except Exception as e:report['error']=str(e)[:700]
          report['finished_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          pathlib.Path('/tmp/aone-inventory.json').write_text(json.dumps(report,separators=(',',':')))
          verified=sum(x.get('verified') is True for x in report['results'])
          print('STANDBY_REDUCTION='+json.dumps({'targets':2,'verified_min_zero':verified,'customer_sends':0,'model_calls':0,'has_error':'error' in report}))
          if verified!=2:raise SystemExit(1)
          PY
      - name: Return encrypted change evidence
        if: always()
        run: |
          node <<'JS'
          const fs=require('fs'),c=require('crypto'),z=require('zlib');
          if(!fs.existsSync('/tmp/aone-inventory.json'))process.exit(0);
          const pub=`-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAm2D6NBaj3mvt2z7xKei5
          hy5Aphe/bsRWfv4ee1HdjO2V8R1BNFyc1vnoTqVwRhrQws16v6Z8BxD0T/pxLlmQ
          lJHcWTkOI5NUJw+3KHMJVzuHQb+ItHBfKavg2WNtUP83aCw2OQRJ/G0S9U9Z03Na
          5ZsQVr0JXHu0xYLkra28vtkbOMQSq1+uiHrzl+WiroYXDF3sdAsmm2cSqm3X4/2/
          n0woDlfQsIq5AA5/yOQUFYGSPpz/9oqcUGjacGCEYHZne9KKNbO0zHnE/H/6cuXe
          PcS55J5pwKhx3Rl+ayFZ2tomtJw9fXlr9WPZ29LQ9NFpdQsAWV68CClxK+ewQaya
          zwIDAQAB
          -----END PUBLIC KEY-----`;
          const key=c.randomBytes(32),iv=c.randomBytes(12),enc=c.createCipheriv('aes-256-gcm',key,iv);
          const data=Buffer.concat([enc.update(z.gzipSync(fs.readFileSync('/tmp/aone-inventory.json'))),enc.final()]);
          console.log('PRIVATE_INVENTORY='+JSON.stringify({key:c.publicEncrypt({key:pub,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:enc.getAuthTag().toString('base64'),data:data.toString('base64')}));
          fs.rmSync('/tmp/aone-inventory.json');
          JS
