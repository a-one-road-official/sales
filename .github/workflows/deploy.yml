name: Deploy Lead Factory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python compile check
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          pip install -r requirements.txt
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No tests collected; continuing for deployment bootstrap"
            exit 0
          fi
          exit "$code"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit --config cloudbuild.yaml .
