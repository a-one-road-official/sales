name: Deploy Lead Factory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python compile check
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          pip install -r requirements.txt
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No tests collected; continuing for deployment bootstrap"
            exit 0
          fi
          exit "$code"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry
        run: |
          gcloud artifacts repositories create aone-lead-factory \
            --repository-format=docker \
            --location=asia-northeast1 \
            --description="A-one Lead Factory images" \
            --project=${{ secrets.GCP_PROJECT_ID }} || true

      - name: Build Docker image
        run: |
          docker build -t asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/aone-lead-factory/aone-lead-factory:latest .

      - name: Push Docker image
        run: |
          docker push asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/aone-lead-factory/aone-lead-factory:latest

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy aone-lead-factory \
            --image=asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/aone-lead-factory/aone-lead-factory:latest \
            --region=asia-northeast1 \
            --platform=managed \
            --service-account=aone-lead-factory-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --timeout=540 \
            --project=${{ secrets.GCP_PROJECT_ID }}
