name: Deploy Lead Factory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lead-factory-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python compile check
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          pip install -r requirements.txt
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No tests collected; continuing for deployment bootstrap"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify gcloud
        run: gcloud version

      - name: Enable required APIs
        run: |
          gcloud services enable \
            sheets.googleapis.com \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            cloudscheduler.googleapis.com \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry
        run: |
          gcloud artifacts repositories describe aone-lead-factory \
            --location=asia-northeast1 \
            --project=${{ secrets.GCP_PROJECT_ID }} >/dev/null 2>&1 || \
          gcloud artifacts repositories create aone-lead-factory \
            --repository-format=docker \
            --location=asia-northeast1 \
            --description="A-one Lead Factory images" \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Build Docker image
        run: |
          docker build -t asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/aone-lead-factory/aone-lead-factory:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/aone-lead-factory/aone-lead-factory:${{ github.sha }}

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy aone-lead-factory \
            --image=asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/aone-lead-factory/aone-lead-factory:${{ github.sha }} \
            --region=asia-northeast1 \
            --platform=managed \
            --service-account=aone-lead-factory-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --timeout=540 \
            --remove-secrets=OPENAI_API_KEY \
            --update-env-vars=LEAD_FACTORY_SPREADSHEET_ID=1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo,LEAD_FACTORY_DRIVE_ROOT_FOLDER_ID=14JY0cfJrNM9uteVmPOQ-SDoYKkSrEX3E,LEAD_FACTORY_DRIVE_SCRAPERS_FOLDER_ID=1c5vE9oAGMXn209JKIyGonJ7pZ4-1bplk,LEAD_FACTORY_META_INTERVAL_SECONDS=120,LEAD_FACTORY_MAX_REPAIR_ATTEMPTS=5,LEAD_FACTORY_AUTONOMY_MODE=UNTIL_TARGET,LEAD_FACTORY_TARGET_NEW_COMPANIES=200,LEAD_FACTORY_AUTONOMY_START_PROMOTED=23,LEAD_FACTORY_STOP_AFTER_ZERO_PROMOTION_RUNS=3,LEAD_FACTORY_AUTONOMY_NOTIFY_EMAIL=admin@a1-road.com \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Configure autonomous schedulers
        run: |
          PROJECT=${{ secrets.GCP_PROJECT_ID }}
          REGION=asia-northeast1
          SERVICE=aone-lead-factory
          INVOKER=aone-lead-factory-deployer@${PROJECT}.iam.gserviceaccount.com
          URL="$(gcloud run services describe ${SERVICE} --region=${REGION} --project=${PROJECT} --format='value(status.url)')"

          gcloud run services add-iam-policy-binding ${SERVICE} \
            --region=${REGION} \
            --project=${PROJECT} \
            --member="serviceAccount:${INVOKER}" \
            --role=roles/run.invoker

          gcloud scheduler jobs pause lead-factory-daily \
            --location=${REGION} --project=${PROJECT} >/dev/null 2>&1 || true

          upsert_job () {
            NAME="$1"
            SCHEDULE="$2"
            URI="$3"
            if gcloud scheduler jobs describe "$NAME" --location=${REGION} --project=${PROJECT} >/dev/null 2>&1; then
              gcloud scheduler jobs update http "$NAME" \
                --location=${REGION} \
                --project=${PROJECT} \
                --schedule="$SCHEDULE" \
                --time-zone="Asia/Tokyo" \
                --uri="$URI" \
                --http-method=POST \
                --attempt-deadline=540s \
                --oidc-service-account-email="${INVOKER}" \
                --oidc-token-audience="${URL}"
            else
              gcloud scheduler jobs create http "$NAME" \
                --location=${REGION} \
                --project=${PROJECT} \
                --schedule="$SCHEDULE" \
                --time-zone="Asia/Tokyo" \
                --uri="$URI" \
                --http-method=POST \
                --attempt-deadline=540s \
                --oidc-service-account-email="${INVOKER}" \
                --oidc-token-audience="${URL}"
            fi
          }

          upsert_job lead-factory-meta "*/2 * * * *" "${URL}/meta/tick"
          upsert_job lead-factory-growth-supply "*/10 * * * *" "${URL}/supply/growth"
          upsert_job lead-factory-mittelstand-supply "2-59/10 * * * *" "${URL}/supply/mittelstand"
          upsert_job lead-factory-maktek-full "0 4 1 1 *" "${URL}/maktek/ingest"
          gcloud scheduler jobs run lead-factory-maktek-full --location=${REGION} --project=${PROJECT}
          gcloud scheduler jobs run lead-factory-mittelstand-supply --location=${REGION} --project=${PROJECT}
          gcloud scheduler jobs run lead-factory-growth-supply --location=${REGION} --project=${PROJECT}

          echo "Cloud Run URL: ${URL}"

      - name: Verify autonomous schedulers
        run: |
          gcloud scheduler jobs list --location=asia-northeast1 --project=${{ secrets.GCP_PROJECT_ID }} --filter="name:lead-factory" --format="table(name,state,schedule,httpTarget.uri)"
