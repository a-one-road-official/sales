name: Deploy Lead Factory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python compile check
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          pip install -r requirements.txt
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No tests collected; continuing for deployment bootstrap"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Sheets API
        run: |
          gcloud services enable sheets.googleapis.com \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Ingest full MAKTEK 2026 exhibitor directory
        env:
          LEAD_FACTORY_SPREADSHEET_ID: 1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo
          RUNTIME_SA: aone-lead-factory@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          python - <<'PY'
          import os
          import google.auth
          from google.auth import impersonated_credentials
          from googleapiclient.discovery import build
          from maktek_ingest import MaktekIngestor
          from sheets_repo import SheetsRepo

          source_credentials, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/cloud-platform"]
          )
          target_credentials = impersonated_credentials.Credentials(
              source_credentials=source_credentials,
              target_principal=os.environ["RUNTIME_SA"],
              target_scopes=["https://www.googleapis.com/auth/spreadsheets"],
              lifetime=3600,
          )
          repo = SheetsRepo(os.environ["LEAD_FACTORY_SPREADSHEET_ID"])
          repo.svc = build("sheets", "v4", credentials=target_credentials, cache_discovery=False)
          result = MaktekIngestor(repo).run()
          print(result)
          if result.get("status") != "PASS" or int(result.get("official_exhibitors", 0)) < 500:
              raise SystemExit(f"MAKTEK ingest incomplete: {result}")
          PY

      - name: Bootstrap Cloud Build API
        continue-on-error: true
        run: |
          gcloud services enable cloudbuild.googleapis.com \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy production runtime and schedulers
        continue-on-error: true
        run: |
          gcloud builds submit \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=asia-northeast1 \
            --config=cloudbuild.yaml \
            .
