name: Deploy Lead Factory

on:
  # Production deployment is a control-plane operation.
  # Development commits must never enqueue or cancel production deploys.
  workflow_dispatch:
    inputs:
      execute_sacrifice:
        description: "Run the isolated non-factory sales_leads ten-company send after deploy"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: lead-factory-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      SERVICE: aone-lead-factory
      RUNTIME_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      OPENAI_SECRET: aone-openai-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python compile check
        run: python -m compileall .

      - name: Run tests
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Generate internal runtime token
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "INTERNAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Enable runtime APIs
        run: |
          gcloud services enable \
            sheets.googleapis.com \
            drive.googleapis.com \
            gmail.googleapis.com \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            cloudscheduler.googleapis.com \
            cloudtasks.googleapis.com \
            aiplatform.googleapis.com \
            --project="$PROJECT"

      - name: Grant Gemini runtime permission
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:$RUNTIME_SA" \
            --role="roles/aiplatform.user" \
            --condition=None >/dev/null 2>&1 || \
            echo "Gemini IAM grant unavailable to deploy identity; remediation remains visible in runtime health/logs."

      - name: Grant runtime queue permission
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:$RUNTIME_SA" \
            --role="roles/cloudtasks.enqueuer" \
            --condition=None >/dev/null 2>&1 || \
            echo "Cloud Tasks IAM grant unavailable to deploy identity; runtime fallback lane remains required."

      - name: Configure Docker auth
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry
        run: |
          gcloud artifacts repositories describe aone-lead-factory \
            --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || \
          gcloud artifacts repositories create aone-lead-factory \
            --repository-format=docker \
            --location="$REGION" \
            --description="A-one Lead Factory images" \
            --project="$PROJECT"

      - name: Build and push Docker image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run autonomous runtime
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --timeout=540 \
            --concurrency=8 \
            --min=1 \
            --max=100 \
            --update-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT},GCP_PROJECT=${PROJECT},LEAD_FACTORY_SPREADSHEET_ID=1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo,LEAD_FACTORY_DRIVE_ROOT_FOLDER_ID=14JY0cfJrNM9uteVmPOQ-SDoYKkSrEX3E,LEAD_FACTORY_DRIVE_SCRAPERS_FOLDER_ID=1c5vE9oAGMXn209JKIyGonJ7pZ4-1bplk,LEAD_FACTORY_META_INTERVAL_SECONDS=120,LEAD_FACTORY_MAX_REPAIR_ATTEMPTS=5,LEAD_FACTORY_AUTONOMY_MODE=UNTIL_EXHAUSTED,LEAD_FACTORY_TARGET_NEW_COMPANIES=1500,LEAD_FACTORY_AUTONOMY_NOTIFY_EMAIL=admin@a1-road.com,LEAD_FACTORY_GMAIL_IMPERSONATE=admin@a1-road.com,LEAD_FACTORY_OPENAI_SECRET=${OPENAI_SECRET},LEAD_FACTORY_INTERNAL_TOKEN=${INTERNAL_TOKEN},LEAD_FACTORY_TASKS_SERVICE_ACCOUNT=${RUNTIME_SA},LEAD_FACTORY_TASKS_QUEUE=lead-factory-workers,LEAD_FACTORY_TASKS_LOCATION=${REGION},LEAD_FACTORY_SOURCE_FRONTIER_LIMIT=40,LEAD_FACTORY_DISPATCH_SOURCE_MAX=5,LEAD_FACTORY_DISPATCH_DOMAIN_MAX=75,LEAD_FACTORY_DISPATCH_GATE_MAX=75,LEAD_FACTORY_DISPATCH_HTTP_WORKERS=4,LEAD_FACTORY_EXHAUSTION_QUIET_MINUTES=180 \
            --project="$PROJECT"

      - name: Bind deployed service URL
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')"
          test -n "$URL"
          gcloud run services update "$SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --update-env-vars=LEAD_FACTORY_SERVICE_URL="$URL" >/dev/null
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"

      - name: Ensure durable worker queue
        run: |
          if gcloud tasks queues describe lead-factory-workers \
            --location="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
            gcloud tasks queues update lead-factory-workers \
              --location="$REGION" --project="$PROJECT" \
              --max-concurrent-dispatches=500 \
              --max-attempts=10 \
              --max-retry-duration=0s
            echo "TASK_QUEUE=AVAILABLE" >> "$GITHUB_ENV"
          else
            echo "Cloud Tasks queue is unavailable to this deploy identity; runtime will use its independent HTTP fallback lane."
            echo "TASK_QUEUE=UNAVAILABLE" >> "$GITHUB_ENV"
          fi

      - name: Configure continuous autonomous schedulers
        run: |
          URL="$SERVICE_URL"

          upsert_job () {
            NAME="$1"
            SCHEDULE="$2"
            URI="$3"
            if gcloud scheduler jobs describe "$NAME" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
              gcloud scheduler jobs update http "$NAME" \
                --location="$REGION" --project="$PROJECT" \
                --schedule="$SCHEDULE" --time-zone="Asia/Tokyo" \
                --uri="$URI" --http-method=POST --attempt-deadline=540s \
                --clear-auth-token \
                --update-headers="X-Aone-Internal-Token=${INTERNAL_TOKEN}"
            else
              gcloud scheduler jobs create http "$NAME" \
                --location="$REGION" --project="$PROJECT" \
                --schedule="$SCHEDULE" --time-zone="Asia/Tokyo" \
                --uri="$URI" --http-method=POST --attempt-deadline=540s \
                --headers="X-Aone-Internal-Token=${INTERNAL_TOKEN}"
            fi
          }

          for OLD in lead-factory-daily lead-factory-growth-supply lead-factory-mittelstand-supply; do
            gcloud scheduler jobs pause "$OLD" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || true
          done

          # Stagger read-heavy control lanes. A simultaneous fan-out exceeds
          # the Sheets per-user read quota before the workers can make progress.
          upsert_job lead-factory-meta "*/5 * * * *" "${URL}/meta/tick"
          upsert_job lead-factory-autonomy-slo "2-59/5 * * * *" "${URL}/autonomy/tick"
          upsert_job lead-factory-discover-growth "*/5 * * * *" "${URL}/discover/growth"
          upsert_job lead-factory-discover-mittelstand "2-59/5 * * * *" "${URL}/discover/mittelstand"
          upsert_job lead-factory-discover-fallback "4-59/5 * * * *" "${URL}/discover/fallback"
          upsert_job lead-factory-dispatch-growth "*/2 * * * *" "${URL}/dispatch/growth"
          upsert_job lead-factory-dispatch-mittelstand "1-59/2 * * * *" "${URL}/dispatch/mittelstand"
          upsert_job lead-factory-promotion "1-59/2 * * * *" "${URL}/promotion/tick"
          upsert_job lead-factory-prep "3-59/5 * * * *" "${URL}/prep/tick"
          upsert_job lead-factory-control "4-59/10 * * * *" "${URL}/control/tick"
          upsert_job lead-factory-maktek-full "0 4 1 1 *" "${URL}/maktek/ingest"

          # Updating a paused Scheduler job does not resume it. Explicitly
          # resume every production lane after updating or creating it.
          for NAME in \
            lead-factory-meta lead-factory-autonomy-slo \
            lead-factory-discover-growth lead-factory-discover-mittelstand \
            lead-factory-discover-fallback lead-factory-dispatch-growth \
            lead-factory-dispatch-mittelstand lead-factory-promotion \
            lead-factory-prep lead-factory-control lead-factory-maktek-full; do
            gcloud scheduler jobs resume "$NAME" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || true
          done

      - name: Runtime deep health check
        run: |
          curl --fail-with-body --retry 10 --retry-all-errors --retry-delay 5 \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            -o /tmp/deep-health.json \
            "${SERVICE_URL}/healthz/deep"
          python -c 'import json; d=json.load(open("/tmp/deep-health.json")); assert d.get("ok") is True, d; assert d.get("gemini_vertex_ready") is True, d; print(json.dumps(d, indent=2, ensure_ascii=False))'

      - name: Register autonomous production goal
        run: |
          echo 'POST /autonomy/start (registration only; workers run asynchronously on Cloud Scheduler)'
          curl --fail-with-body --retry 10 --retry-all-errors --retry-delay 5 \
            -X POST \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"target":1500}' \
            "${SERVICE_URL}/autonomy/start"
          echo

      - name: Execute isolated ten-company sacrifice batch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_sacrifice == true }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"limit":10,"execute_external":true}' \
            -o /tmp/sacrifice.json \
            "${SERVICE_URL}/outreach/sales-leads-sacrifice-run"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/sacrifice.json'))
          summary={"run_id":d.get("run_id"),"attempted":d.get("attempted"),"production_ssot_touched":d.get("production_ssot_touched"),"results":[{"company_name":x.get("company_name"),"status":x.get("status"),"stage":x.get("stage"),"external_action":x.get("external_action"),"message_id":(x.get("execution") or {}).get("message_id","")} for x in d.get("results",[])]}
          print(json.dumps(summary,ensure_ascii=False))
          assert summary["production_ssot_touched"] is False
          assert summary["attempted"] == 10
          PY

      - name: Bootstrap first autonomous tick
        run: |
          for PATH_NAME in /meta/tick; do
            echo "POST ${PATH_NAME}"
            timeout 120 curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 \
              -X POST \
              -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
              -H "Content-Type: application/json" \
              "${SERVICE_URL}${PATH_NAME}"
          done

      - name: Verify autonomous infrastructure
        run: |
          echo '--- Cloud Run ---'
          gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" \
            --format="yaml(status.url,status.latestReadyRevisionName,spec.template.spec.containerConcurrency,spec.template.spec.serviceAccountName)"
          echo '--- Schedulers ---'
          gcloud scheduler jobs list --location="$REGION" --project="$PROJECT" \
            --filter="name:lead-factory" --format="table(name,state,schedule,httpTarget.uri)"
