name: Deploy Lead Factory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lead-factory-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      SERVICE: aone-lead-factory
      RUNTIME_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      OPENAI_SECRET: aone-openai-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python compile check
        run: python -m compileall .

      - name: Run tests
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Generate internal runtime token
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "INTERNAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Enable runtime APIs
        run: |
          gcloud services enable \
            sheets.googleapis.com \
            drive.googleapis.com \
            gmail.googleapis.com \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            cloudscheduler.googleapis.com \
            --project="$PROJECT"

      - name: Configure Docker auth
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry
        run: |
          gcloud artifacts repositories describe aone-lead-factory \
            --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || \
          gcloud artifacts repositories create aone-lead-factory \
            --repository-format=docker \
            --location="$REGION" \
            --description="A-one Lead Factory images" \
            --project="$PROJECT"

      - name: Build and push Docker image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run autonomous runtime
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --timeout=540 \
            --concurrency=8 \
            --min=1 \
            --max=100 \
            --update-env-vars=LEAD_FACTORY_SPREADSHEET_ID=1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo,LEAD_FACTORY_DRIVE_ROOT_FOLDER_ID=14JY0cfJrNM9uteVmPOQ-SDoYKkSrEX3E,LEAD_FACTORY_DRIVE_SCRAPERS_FOLDER_ID=1c5vE9oAGMXn209JKIyGonJ7pZ4-1bplk,LEAD_FACTORY_META_INTERVAL_SECONDS=120,LEAD_FACTORY_MAX_REPAIR_ATTEMPTS=5,LEAD_FACTORY_AUTONOMY_MODE=UNTIL_EXHAUSTED,LEAD_FACTORY_AUTONOMY_NOTIFY_EMAIL=admin@a1-road.com,LEAD_FACTORY_GMAIL_IMPERSONATE=admin@a1-road.com,LEAD_FACTORY_OPENAI_SECRET=${OPENAI_SECRET},LEAD_FACTORY_INTERNAL_TOKEN=${INTERNAL_TOKEN},LEAD_FACTORY_SOURCE_FRONTIER_LIMIT=40,LEAD_FACTORY_DISPATCH_SOURCE_MAX=5,LEAD_FACTORY_DISPATCH_DOMAIN_MAX=75,LEAD_FACTORY_DISPATCH_GATE_MAX=75,LEAD_FACTORY_DISPATCH_HTTP_WORKERS=120,LEAD_FACTORY_EXHAUSTION_QUIET_MINUTES=180 \
            --project="$PROJECT"

      - name: Bind deployed service URL
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')"
          test -n "$URL"
          gcloud run services update "$SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --update-env-vars=LEAD_FACTORY_SERVICE_URL="$URL" >/dev/null
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"

      - name: Configure continuous autonomous schedulers
        run: |
          URL="$SERVICE_URL"

          upsert_job () {
            NAME="$1"
            SCHEDULE="$2"
            URI="$3"
            if gcloud scheduler jobs describe "$NAME" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
              gcloud scheduler jobs update http "$NAME" \
                --location="$REGION" --project="$PROJECT" \
                --schedule="$SCHEDULE" --time-zone="Asia/Tokyo" \
                --uri="$URI" --http-method=POST --attempt-deadline=540s \
                --clear-auth-token \
                --update-headers="X-Aone-Internal-Token=${INTERNAL_TOKEN}"
            else
              gcloud scheduler jobs create http "$NAME" \
                --location="$REGION" --project="$PROJECT" \
                --schedule="$SCHEDULE" --time-zone="Asia/Tokyo" \
                --uri="$URI" --http-method=POST --attempt-deadline=540s \
                --headers="X-Aone-Internal-Token=${INTERNAL_TOKEN}"
            fi
          }

          for OLD in lead-factory-daily lead-factory-growth-supply lead-factory-mittelstand-supply; do
            gcloud scheduler jobs pause "$OLD" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || true
          done

          upsert_job lead-factory-meta "*/2 * * * *" "${URL}/meta/tick"
          upsert_job lead-factory-autonomy-slo "*/2 * * * *" "${URL}/autonomy/tick"
          upsert_job lead-factory-discover-growth "*/5 * * * *" "${URL}/discover/growth"
          upsert_job lead-factory-discover-mittelstand "2-59/5 * * * *" "${URL}/discover/mittelstand"
          upsert_job lead-factory-dispatch-growth "* * * * *" "${URL}/dispatch/growth"
          upsert_job lead-factory-dispatch-mittelstand "* * * * *" "${URL}/dispatch/mittelstand"
          upsert_job lead-factory-promotion "* * * * *" "${URL}/promotion/tick"
          upsert_job lead-factory-prep "*/5 * * * *" "${URL}/prep/tick"
          upsert_job lead-factory-control "*/10 * * * *" "${URL}/control/tick"
          upsert_job lead-factory-maktek-full "0 4 1 1 *" "${URL}/maktek/ingest"

      - name: Runtime deep health check
        run: |
          curl --fail-with-body --retry 10 --retry-all-errors --retry-delay 5 \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            -o /tmp/deep-health.json \
            "${SERVICE_URL}/healthz/deep"
          python -c 'import json; d=json.load(open("/tmp/deep-health.json")); assert d.get("ok") is True, d; assert d.get("openai_key_present") is True, d; print(json.dumps(d, indent=2, ensure_ascii=False))'

      - name: Kick autonomous frontier and workers now
        continue-on-error: true
        run: |
          echo 'POST /autonomy/start'
          curl --fail-with-body --retry 10 --retry-all-errors --retry-delay 5 \
            -X POST \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"target":1500}' \
            "${SERVICE_URL}/autonomy/start"
          echo
          call () {
            REQUEST_PATH="$1"
            echo "POST $REQUEST_PATH"
            curl --fail-with-body --retry 3 --retry-delay 3 \
              -X POST \
              -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
              -H "Content-Type: application/json" \
              "${SERVICE_URL}${REQUEST_PATH}"
            echo
          }
          call /discover/growth
          call /discover/mittelstand
          call /dispatch/growth
          call /dispatch/mittelstand
          call /promotion/tick

      - name: Verify autonomous infrastructure
        run: |
          echo '--- Cloud Run ---'
          gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" \
            --format="yaml(status.url,status.latestReadyRevisionName,spec.template.spec.containerConcurrency,spec.template.spec.serviceAccountName)"
          echo '--- Schedulers ---'
          gcloud scheduler jobs list --location="$REGION" --project="$PROJECT" \
            --filter="name:lead-factory" --format="table(name,state,schedule,httpTarget.uri)"
