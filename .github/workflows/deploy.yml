name: Deploy Lead Factory

on:
  push:
    branches: [main]
  # Production deployment is a control-plane operation.
  # Development commits must never enqueue or cancel production deploys.
  workflow_dispatch:
    inputs:
      execute_sacrifice:
        description: "Run the isolated non-factory sales_leads ten-company send only with explicit repository approval"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: lead-factory-qualified-ssot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      SERVICE: aone-lead-factory
      SACRIFICE_SERVICE: aone-sacrifice-${{ github.run_id }}
      RUNTIME_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      OPENAI_SECRET: aone-openai-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python compile check
        run: python -m compileall .

      - name: Run tests
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Generate internal runtime token
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "INTERNAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SACRIFICE_INTERNAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Enforce list-only mode and stop legacy send lane
        run: |
          echo "LIST_ONLY_MODE=TRUE"
          gcloud scheduler jobs pause lead-factory-approved-sacrifice-${{ github.run_id }}             --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || true
          if gcloud run services describe "$SACRIFICE_SERVICE"             --region="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
            gcloud run services update "$SACRIFICE_SERVICE"               --region="$REGION" --project="$PROJECT"               --update-env-vars=LEAD_FACTORY_ALLOW_EXTERNAL_WRITE=FALSE,LEAD_FACTORY_FACTORY_SEND_ENABLED=FALSE,OUTREACH_FACTORY_SEND_ENABLED=FALSE,OUTREACH_SACRIFICE_SEND_ENABLED=FALSE               >/dev/null
          else
            echo "No existing sacrifice service found; send lane remains disabled by code defaults."
          fi

      - name: Enable runtime APIs
        run: |
          gcloud services enable \
            sheets.googleapis.com \
            drive.googleapis.com \
            gmail.googleapis.com \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            cloudscheduler.googleapis.com \
            cloudtasks.googleapis.com \
            aiplatform.googleapis.com \
            --project="$PROJECT"

      - name: Grant Gemini runtime permission
        run: |
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:$RUNTIME_SA" \
            --role="roles/aiplatform.user" \
            --condition=None >/dev/null 2>&1 || \
            echo "Gemini IAM grant unavailable to deploy identity; remediation remains visible in runtime health/logs."

      - name: Grant runtime queue permission
        run: |
          set -euo pipefail
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:$RUNTIME_SA" \
            --role="roles/cloudtasks.enqueuer" \
            --condition=None >/dev/null
          gcloud projects get-iam-policy "$PROJECT" \
            --flatten="bindings[].members" \
            --filter="bindings.members=serviceAccount:$RUNTIME_SA AND bindings.role=roles/cloudtasks.enqueuer" \
            --format="value(bindings.role)" | grep -qx "roles/cloudtasks.enqueuer"

      - name: Configure Docker auth
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry
        run: |
          gcloud artifacts repositories describe aone-lead-factory \
            --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || \
          gcloud artifacts repositories create aone-lead-factory \
            --repository-format=docker \
            --location="$REGION" \
            --description="A-one Lead Factory images" \
            --project="$PROJECT"

      - name: Build and push Docker image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run autonomous runtime
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --timeout=540 \
            --concurrency=4 \
            --min=1 \
            --max=1 \
            --no-cpu-throttling \
            --update-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT},GCP_PROJECT=${PROJECT},LEAD_FACTORY_SPREADSHEET_ID=1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo,LEAD_FACTORY_DRIVE_ROOT_FOLDER_ID=14JY0cfJrNM9uteVmPOQ-SDoYKkSrEX3E,LEAD_FACTORY_DRIVE_SCRAPERS_FOLDER_ID=1c5vE9oAGMXn209JKIyGonJ7pZ4-1bplk,LEAD_FACTORY_META_INTERVAL_SECONDS=120,LEAD_FACTORY_MAX_REPAIR_ATTEMPTS=5,LEAD_FACTORY_AUTONOMY_MODE=UNTIL_EXHAUSTED,LEAD_FACTORY_TARGET_NEW_COMPANIES=1500,LEAD_FACTORY_AUTONOMY_NOTIFY_EMAIL=admin@a1-road.com,LEAD_FACTORY_GMAIL_IMPERSONATE=admin@a1-road.com,LEAD_FACTORY_OPENAI_SECRET=${OPENAI_SECRET},LEAD_FACTORY_INTERNAL_TOKEN=${INTERNAL_TOKEN},LEAD_FACTORY_TASKS_SERVICE_ACCOUNT=${RUNTIME_SA},LEAD_FACTORY_TASKS_QUEUE=lead-factory-workers,LEAD_FACTORY_TASKS_LOCATION=${REGION},LEAD_FACTORY_SOURCE_FRONTIER_LIMIT=10,LEAD_FACTORY_DISPATCH_SOURCE_MAX=10,LEAD_FACTORY_DISPATCH_DOMAIN_MAX=200,LEAD_FACTORY_DISPATCH_GATE_MAX=200,LEAD_FACTORY_DISPATCH_HTTP_WORKERS=4,LEAD_FACTORY_FAILOVER_DOMAIN_BATCH=10,LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED=FALSE,LEAD_FACTORY_AUTONOMY_SUPERVISOR_INTERVAL_SECONDS=90,LEAD_FACTORY_AUTONOMY_SUPERVISOR_INITIAL_DELAY_SECONDS=20,LEAD_FACTORY_RECOVERY_BATCH=1,LEAD_FACTORY_DIRECT_ADAPTER_FALLBACK_ENABLED=TRUE,LEAD_FACTORY_ALLOW_EXTERNAL_WRITE=FALSE,LEAD_FACTORY_FACTORY_SEND_ENABLED=FALSE,OUTREACH_FACTORY_SEND_ENABLED=FALSE,OUTREACH_SACRIFICE_SEND_ENABLED=FALSE,OUTREACH_READY_ENABLED=FALSE,LEAD_FACTORY_INTERNAL_NOTIFY_ENABLED=FALSE,LEAD_FACTORY_SHEETS_READ_MIN_INTERVAL_SECONDS=0.5,LEAD_FACTORY_SHEETS_READ_CACHE_TTL_SECONDS=10,LEAD_FACTORY_SHEETS_WRITE_MIN_INTERVAL_SECONDS=0.25,ALLOW_DIRECT_ADAPTER_EXECUTION=TRUE,LEAD_FACTORY_EXHAUSTION_QUIET_MINUTES=180 \
            --project="$PROJECT"


      - name: Deploy isolated sacrifice runtime
        if: ${{ false }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          gcloud run deploy "$SACRIFICE_SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --timeout=540 \
            --concurrency=1 \
            --min=1 \
            --max=1 \
            --no-cpu-throttling \
            --update-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT},GCP_PROJECT=${PROJECT},LEAD_FACTORY_SPREADSHEET_ID=1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo,LEAD_FACTORY_DRIVE_ROOT_FOLDER_ID=14JY0cfJrNM9uteVmPOQ-SDoYKkSrEX3E,LEAD_FACTORY_DRIVE_SCRAPERS_FOLDER_ID=1c5vE9oAGMXn209JKIyGonJ7pZ4-1bplk,LEAD_FACTORY_META_INTERVAL_SECONDS=120,LEAD_FACTORY_AUTONOMY_MODE=UNTIL_EXHAUSTED,LEAD_FACTORY_TARGET_NEW_COMPANIES=1500,LEAD_FACTORY_AUTONOMY_NOTIFY_EMAIL=admin@a1-road.com,LEAD_FACTORY_GMAIL_IMPERSONATE=admin@a1-road.com,LEAD_FACTORY_DRIVE_IMPERSONATE=admin@a1-road.com,LEAD_FACTORY_OPENAI_SECRET=${OPENAI_SECRET},LEAD_FACTORY_INTERNAL_TOKEN=${INTERNAL_TOKEN},LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED=FALSE,LEAD_FACTORY_ALLOW_EXTERNAL_WRITE=FALSE,LEAD_FACTORY_FACTORY_SEND_ENABLED=FALSE,OUTREACH_FACTORY_SEND_ENABLED=FALSE,OUTREACH_SACRIFICE_SEND_ENABLED=TRUE,OUTREACH_SACRIFICE_TARGET_COMPANIES=AbnormalAI|ChannelEngine|CommerceIQ|commercetools|FitAnalytics|Narvar|Tapcart|Workato|RetailNext|Plytix,LEAD_FACTORY_DIRECT_ADAPTER_FALLBACK_ENABLED=TRUE,LEAD_FACTORY_SHEETS_READ_MIN_INTERVAL_SECONDS=2.0,LEAD_FACTORY_SHEETS_READ_CACHE_TTL_SECONDS=10,LEAD_FACTORY_SHEETS_WRITE_MIN_INTERVAL_SECONDS=0.25 \
            --project="$PROJECT"
          SACRIFICE_URL="$(gcloud run services describe "$SACRIFICE_SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')"
          test -n "$SACRIFICE_URL"
          gcloud run services update "$SACRIFICE_SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --update-env-vars=LEAD_FACTORY_SERVICE_URL="$SACRIFICE_URL" >/dev/null
          echo "SACRIFICE_SERVICE_URL=$SACRIFICE_URL" >> "$GITHUB_ENV"
          curl --fail-with-body --retry 10 --retry-all-errors --retry-delay 3 \
            -H "X-Aone-Internal-Token: ${SACRIFICE_INTERNAL_TOKEN}" \
            "$SACRIFICE_URL/healthz/deep"

      - name: Bind deployed service URL
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')"
          test -n "$URL"
          gcloud run services update "$SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --update-env-vars=LEAD_FACTORY_DRIVE_IMPERSONATE=admin@a1-road.com >/dev/null
          gcloud run services update "$SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --update-env-vars=LEAD_FACTORY_SERVICE_URL="$URL" >/dev/null
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"

      - name: Synchronize controller token with serving revision
        run: |
          RUNTIME_TOKEN="$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT" --format=json | \
            python -c 'import json,sys; d=json.load(sys.stdin); e=d.get("spec",{}).get("template",{}).get("spec",{}).get("containers",[{}])[0].get("env",[]); print(next((x.get("value","") for x in e if x.get("name")=="LEAD_FACTORY_INTERNAL_TOKEN"), ""))')"
          test -n "$RUNTIME_TOKEN"
          echo "::add-mask::$RUNTIME_TOKEN"
          echo "INTERNAL_TOKEN=$RUNTIME_TOKEN" >> "$GITHUB_ENV"

      - name: Ensure durable worker queue
        run: |
          set -euo pipefail
          if ! gcloud tasks queues describe lead-factory-workers \
            --location="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
            gcloud tasks queues create lead-factory-workers \
              --location="$REGION" --project="$PROJECT"
          fi
          gcloud tasks queues update lead-factory-workers \
            --location="$REGION" --project="$PROJECT" \
            --max-concurrent-dispatches=4 \
            --max-attempts=20 \
            --max-retry-duration=0s
          gcloud tasks queues describe lead-factory-workers \
            --location="$REGION" --project="$PROJECT" \
            --format="yaml(state,rateLimits.maxConcurrentDispatches,retryConfig.maxAttempts)"

      - name: Configure continuous autonomous schedulers
        run: |
          set -euo pipefail
          URL="$SERVICE_URL"

          upsert_job () {
            NAME="$1"
            SCHEDULE="$2"
            URI="$3"
            TOKEN_VALUE="${4:-${INTERNAL_TOKEN}}"
            if gcloud scheduler jobs describe "$NAME" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
              gcloud scheduler jobs update http "$NAME" \
                --location="$REGION" --project="$PROJECT" \
                --schedule="$SCHEDULE" --time-zone="Asia/Tokyo" \
                --uri="$URI" --http-method=POST --attempt-deadline=540s \
                --clear-auth-token \
                --update-headers="X-Aone-Internal-Token=${TOKEN_VALUE}"
            else
              gcloud scheduler jobs create http "$NAME" \
                --location="$REGION" --project="$PROJECT" \
                --schedule="$SCHEDULE" --time-zone="Asia/Tokyo" \
                --uri="$URI" --http-method=POST --attempt-deadline=540s \
                --headers="X-Aone-Internal-Token=${TOKEN_VALUE}"
            fi
            gcloud scheduler jobs resume "$NAME" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || true
          }

          # Keep legacy direct/serial lanes paused; Cloud Tasks is the sole worker fan-out.
          for OLD in lead-factory-daily lead-factory-growth-supply lead-factory-mittelstand-supply lead-factory-domain-failover lead-factory-recovery lead-factory-source-failover lead-factory-prep; do
            gcloud scheduler jobs pause "$OLD" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || true
          done

          upsert_job lead-factory-meta "*/5 * * * *" "${URL}/meta/tick"
          upsert_job lead-factory-autonomy-slo "2-59/5 * * * *" "${URL}/autonomy/tick"
          upsert_job lead-factory-discover-growth "*/5 * * * *" "${URL}/discover/growth"
          upsert_job lead-factory-discover-mittelstand "2-59/5 * * * *" "${URL}/discover/mittelstand"
          upsert_job lead-factory-discover-fallback "4-59/5 * * * *" "${URL}/discover/fallback"
          upsert_job lead-factory-dispatch-growth "*/2 * * * *" "${URL}/dispatch/growth"
          upsert_job lead-factory-dispatch-mittelstand "1-59/2 * * * *" "${URL}/dispatch/mittelstand"
          upsert_job lead-factory-promotion "1-59/2 * * * *" "${URL}/promotion/tick"
          upsert_job lead-factory-control "4-59/10 * * * *" "${URL}/control/tick"
          upsert_job lead-factory-maktek-full "0 4 1 1 *" "${URL}/maktek/ingest"

          # Pause every historical sacrifice job, including run-scoped names.
          for NAME in $(gcloud scheduler jobs list --location="$REGION" --project="$PROJECT" --format='value(name)' | sed 's#.*/##' | grep -E '^lead-factory-(approved-sacrifice|sacrifice)(-|$)' || true); do
            gcloud scheduler jobs pause "$NAME" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || true
          done
          gcloud scheduler jobs pause lead-factory-approved-sacrifice-${{ github.run_id }} --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || true

      - name: Runtime deep health check
        run: |
          curl --fail-with-body --retry 10 --retry-all-errors --retry-delay 5 \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            -o /tmp/deep-health.json \
            "${SERVICE_URL}/healthz/deep"
          python -c 'import json; d=json.load(open("/tmp/deep-health.json")); assert d.get("ok") is True, d; assert d.get("gemini_vertex_ready") is True, d; print(json.dumps(d, indent=2, ensure_ascii=False))'

      - name: Register autonomous production goal
        continue-on-error: true
        run: |
          echo 'POST /autonomy/start (durable qualified-SSOT goal)'
          if git log -1 --pretty=%B | grep -q 'START_GOAL_8H'; then
            DEADLINE="$(date -u -d '+8 hours' +%Y-%m-%dT%H:%M:%SZ)"
            BODY="{\"target\":1500,\"deadline\":\"${DEADLINE}\",\"force_reset\":true}"
            echo "Starting fresh eight-hour SSOT accounting window; deadline=${DEADLINE}"
          else
            BODY='{"target":1500}'
          fi
          timeout 120 curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --retry-delay 5 \
            -X POST \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}" \
            "${SERVICE_URL}/autonomy/start" || \
            echo "::warning::goal registration response delayed; persisted goal and autonomous schedulers remain active"
          echo

      - name: Reassert approved sacrifice send flag
        if: ${{ false }}
        run: |
          gcloud run services update "$SACRIFICE_SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --update-env-vars=LEAD_FACTORY_ALLOW_EXTERNAL_WRITE=FALSE,LEAD_FACTORY_FACTORY_SEND_ENABLED=FALSE,OUTREACH_FACTORY_SEND_ENABLED=FALSE,OUTREACH_SACRIFICE_SEND_ENABLED=TRUE \
            >/dev/null
          echo "approved_sacrifice_send_flag=TRUE"

      - name: Execute isolated ten-company sacrifice batch
        if: ${{ false }}
        run: |
          set +e
          BATCH_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export BATCH_ID
          mkdir -p /tmp/sacrifice-results
          for N in $(seq 1 30); do
            python - "$BATCH_ID" "$N" > /tmp/sacrifice-body.json <<'PY'
          import json, sys
          print(json.dumps({
              "limit": 1,
              "execute_external": True,
              "batch_id": sys.argv[1],
              "batch_slot": int(sys.argv[2]) - 1,
          }))
          PY
            OUT="/tmp/sacrifice-results/${N}.json"
            echo "sacrifice_company_slot=${N}"
            HTTP_CODE="$(
              curl --silent --show-error --fail-with-body \
                --max-time 150 --retry 1 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
                --write-out '%{http_code}' \
                -X POST \
                -H "X-Aone-Internal-Token: ${SACRIFICE_INTERNAL_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @/tmp/sacrifice-body.json \
                -o "$OUT" \
                "${SACRIFICE_SERVICE_URL}/outreach/sales-leads-sacrifice-run"
            )"
            CURL_STATUS="$?"
            if [ "$CURL_STATUS" -ne 0 ] || [ ! -s "$OUT" ]; then
              python - "$N" "$CURL_STATUS" "$HTTP_CODE" "$OUT" <<'PY' > "$OUT"
          import json, sys
          print(json.dumps({
              "status": "REQUEST_FAILED",
              "slot": int(sys.argv[1]),
              "curl_status": int(sys.argv[2] or 0),
              "http_code": sys.argv[3],
              "request_failure": True,
          }, ensure_ascii=False))
          PY
            fi
            python - "$N" "$OUT" <<'PY'
          import json, sys
          path = sys.argv[2]
          try:
              data = json.load(open(path, encoding="utf-8"))
          except Exception as exc:
              data = {"status": "REQUEST_FAILED", "request_failure": True, "error": f"{type(exc).__name__}:{exc}"}
          if data.get("results"):
              item = data["results"][0]
              detail = {
                  "slot": int(sys.argv[1]),
                  "company_name": item.get("company_name"),
                  "source_row": item.get("source_row"),
                  "status": item.get("status"),
                  "stage": item.get("stage"),
                  "external_action": item.get("external_action"),
                  "message_id": (item.get("execution") or {}).get("message_id", ""),
                  "audit": item.get("audit"),
                  "draft": item.get("draft"),
                  "form_execution": item.get("form_execution"),
                  "preflight": item.get("preflight"),
              }
          else:
              detail = {"slot": int(sys.argv[1]), "request": data}
          print(json.dumps(detail, ensure_ascii=False))
          PY
            SUCCESS_COUNT="$(python - "$OUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(sum(1 for item in (data.get("results") or []) if item.get("status") in {"SENT", "FORM_SENT"}))
          PY
            )"
            if [ "${SUCCESS_COUNT}" -ge 10 ]; then
              echo "sacrifice_success_target_reached=${SUCCESS_COUNT}"
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          paths = sorted(Path("/tmp/sacrifice-results").glob("*.json"), key=lambda p: int(p.stem))
          rows = []
          request_failures = []
          for path in paths:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  request_failures.append({"file": str(path), "error": f"{type(exc).__name__}:{exc}"})
                  continue
              if data.get("results"):
                  rows.extend(data.get("results") or [])
              elif data.get("request_failure"):
                  request_failures.append(data)
          source_rows = [str(row.get("source_row") or "") for row in rows]
          message_ids = [
              str((row.get("execution") or {}).get("message_id") or "").strip()
              for row in rows
              if row.get("status") == "SENT"
              and str((row.get("execution") or {}).get("message_id") or "").strip()
          ]
          form_confirmations = [
              {
                  "company_name": row.get("company_name"),
                  "source_row": row.get("source_row"),
                  "form_url": (row.get("form_execution") or {}).get("form_url", ""),
                  "confirmation": (row.get("form_execution") or {}).get("confirmation", ""),
              }
              for row in rows
              if row.get("status") == "FORM_SENT"
          ]
          successes = sum(1 for row in rows if row.get("status") in {"SENT", "FORM_SENT"})
          report = {
              "batch_id": os.environ.get("BATCH_ID", ""),
              "attempted": len(rows) + len(request_failures),
              "request_failures": request_failures,
              "unique_source_rows": len(set(source_rows)),
              "email_message_ids": message_ids,
              "form_confirmations": form_confirmations,
              "success_count": successes,
              "failure_count": len(rows) - successes + len(request_failures),
              "production_ssot_touched": False,
              "results": [
                  {
                      "company_name": row.get("company_name"),
                      "source_row": row.get("source_row"),
                      "status": row.get("status"),
                      "stage": row.get("stage"),
                      "external_action": row.get("external_action"),
                      "message_id": (row.get("execution") or {}).get("message_id", ""),
                      "form_confirmation": (row.get("form_execution") or {}).get("confirmation", ""),
                      "failure": row.get("error_message", ""),
                      "recipient_evidence": row.get("recipient_evidence"),
                      "audit": row.get("audit"),
                      "draft": row.get("draft"),
                      "form_execution": row.get("form_execution"),
                      "preflight": row.get("preflight"),
                  }
                  for row in rows
              ],
          }
          print(json.dumps(report, ensure_ascii=False))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("### Sacrifice batch audit\n\n")
                  handle.write(chr(96) * 3 + "json\n")
                  handle.write(json.dumps(report, ensure_ascii=False, indent=2))
                  handle.write("\n" + chr(96) * 3 + "\n")
          assert report["production_ssot_touched"] is False
          assert report["unique_source_rows"] == len(source_rows)
          assert len(message_ids) == len(set(message_ids))
          if successes < 10 or len(source_rows) != len(set(source_rows)) or len(message_ids) != len(set(message_ids)):
              raise SystemExit("sacrifice_batch_did_not_complete_ten_external_sends")
          PY
      - name: Re-synchronize controller token before internal bootstrap
        run: |
          RUNTIME_TOKEN="$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT" --format=json | \
            python -c 'import json,sys; d=json.load(sys.stdin); e=d.get("spec",{}).get("template",{}).get("spec",{}).get("containers",[{}])[0].get("env",[]); print(next((x.get("value","") for x in e if x.get("name")=="LEAD_FACTORY_INTERNAL_TOKEN"), ""))')"
          test -n "$RUNTIME_TOKEN"
          echo "::add-mask::$RUNTIME_TOKEN"
          echo "INTERNAL_TOKEN=$RUNTIME_TOKEN" >> "$GITHUB_ENV"

      - name: Bootstrap first autonomous tick
        continue-on-error: true
        run: |
          for PATH_NAME in /meta/tick; do
            echo "POST ${PATH_NAME}"
            timeout 120 curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 \
              -X POST \
              -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
              -H "Content-Type: application/json" \
              "${SERVICE_URL}${PATH_NAME}" || echo "bootstrap_tick_deferred"
          done


      - name: Bootstrap promotion ledger reconciliation
        run: |
          echo "POST /promotion/tick (internal SSOT accounting bootstrap)"
          timeout 480 curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 3 \
            -X POST \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            "${SERVICE_URL}/promotion/tick"

      - name: Verify isolated sacrifice scheduler target
        if: ${{ false }}
        run: |
          gcloud scheduler jobs describe lead-factory-approved-sacrifice-${{ github.run_id }} \
            --location="$REGION" --project="$PROJECT" \
            --format="yaml(state,schedule,httpTarget.uri)"

      - name: Activate and verify execution after deploy
        continue-on-error: true
        run: |
          echo "Starting direct recovery execution; this step is independent of ChatGPT session lifetime."
          for ATTEMPT in 1 2 3 4 5 6; do
            RESPONSE="$(timeout 30 curl --silent --show-error --fail-with-body \
              -X POST \
              -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
              -H "Content-Type: application/json" \
              "${SERVICE_URL}/failover/domain" || true)"
            echo "activation_attempt=${ATTEMPT} response=${RESPONSE:0:1000}"
            PROCESSED="$(python -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print(int(d.get("processed",0) or 0))' <<<"${RESPONSE}" 2>/dev/null || echo 0)"
            if [ "${PROCESSED}" -gt 0 ]; then
              echo "execution_started processed=${PROCESSED}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::deployment succeeded; direct recovery execution is queued for Scheduler retry"

      - name: Publish runtime execution status
        continue-on-error: true
        run: |
          timeout 90 curl --silent --show-error --fail-with-body \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            "${SERVICE_URL}/ops/status" | tee /tmp/ops-status.json
          if [ -s /tmp/ops-status.json ]; then
            {
              echo '### Lead Factory execution paths'
              echo '```json'
              cat /tmp/ops-status.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify autonomous infrastructure
        run: |
          echo '--- Cloud Run ---'
          gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" \
            --format="yaml(status.url,status.latestReadyRevisionName,spec.template.spec.containerConcurrency,spec.template.spec.serviceAccountName)"
          echo '--- Schedulers ---'
          gcloud scheduler jobs list --location="$REGION" --project="$PROJECT" \
            --filter="name:lead-factory" --format="table(name,state,schedule,httpTarget.uri)"
