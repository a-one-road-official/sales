name: Customer-first one-shot integration
on:
  push:
    branches: ['customer-first/ssot-quality-20260920']
    paths: ['.github/workflows/customer-first-build.yml', 'tools/build_customer_first.py']
permissions:
  contents: write
concurrency:
  group: customer-first-one-shot-integration
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'BUILD_CUSTOMER_FIRST_20260920')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LEAD_FACTORY_VERTEX_ALLOWED: FALSE
      LEAD_FACTORY_PAID_AI_ALLOWED: FALSE
      LEAD_FACTORY_PAID_CLOUD_ALLOWED: FALSE
      LEAD_FACTORY_ALLOW_EXTERNAL_WRITE: FALSE
      LEAD_FACTORY_SEND_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer-first/ssot-quality-20260920
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the exact source migration without live credentials
        run: |
          python cost_guard.py
          python tools/build_customer_first.py
          python -m compileall -q .
      - name: Install existing test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run regression tests including real local-form submissions
        run: pytest -q
      - name: Commit tested code and remove this one-shot entrypoint
        run: |
          rm tools/build_customer_first.py .github/workflows/customer-first-build.yml
          git config user.name 'a-one-road-official'
          git config user.email 'admin@a1-road.com'
          git add customer_care.py customer_sheet.py tests/test_customer_care.py form_execution.py outreach_master.py sales_history.py sales_leads_sacrifice_run.py outreach_cycle.py tools/build_customer_first.py .github/workflows/customer-first-build.yml
          git commit -m 'Customer-first safeguards tested; retire one-shot builder'
          git push origin HEAD:customer-first/ssot-quality-20260920
          echo 'Tests passed; production writes=0; customer sends=0; temporary builder removed.' >> "$GITHUB_STEP_SUMMARY"
