name: Workbook logical-separation verification (read only)

on:
  workflow_dispatch:
  push:
    branches: [codex/workbook-meeting-engine]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEAD_FACTORY_VERTEX_ALLOWED: FALSE
      LEAD_FACTORY_ALLOW_EXTERNAL_WRITE: FALSE
      LEAD_FACTORY_SEND_MODE: DISABLED
      LEAD_FACTORY_LIST_ONLY_LOCK: TRUE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: pip install google-auth==2.36.0 google-api-python-client==2.154.0
      - run: python workbook_sales.py --check --output workbook-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: workbook-readonly-summary
          path: workbook-preflight.json
