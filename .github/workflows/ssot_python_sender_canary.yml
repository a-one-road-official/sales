name: SSOT Python sender canary\n\non:\n  workflow_dispatch:\n    inputs:\n      rows:\n        description: 'Comma-separated SSOT row numbers; blank uses queue'\n        required: false\n        default: ''\n      limit:\n        description: 'Maximum external attempts'\n        required: false\n        default: '1'\n  push:\n    branches: [feat/ssot-python-sender-20260921]\n    paths: ['.github/ssot-python-sender-trigger']\n\npermissions:\n  contents: read\n  id-token: write\n\nconcurrency:\n  group: ssot-python-sender\n  cancel-in-progress: false\n\njobs:\n  send:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    env:\n      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}\n      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}\n      LEAD_FACTORY_GMAIL_IMPERSONATE: admin@a1-road.com\n      LEAD_FACTORY_GMAIL_SIGNING_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}\n      LEAD_FACTORY_TASKS_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}\n      SSOT_OUTBOUND_ONLY_ROWS: ${{ inputs.rows || '5137' }}\n      SSOT_OUTBOUND_LIMIT: ${{ inputs.limit || '1' }}\n      SSOT_OUTBOUND_SEND_SPACING_SECONDS: '5'\n      LEAD_FACTORY_VERTEX_ALLOWED: 'FALSE'\n      LEAD_FACTORY_GEMINI_ALLOWED: 'FALSE'\n      LEAD_FACTORY_OPENAI_ALLOWED: 'FALSE'\n      LEAD_FACTORY_PAID_AI_BUDGET_USD: '0'\n    steps:\n      - uses: actions/checkout@v4\n      - name: Authenticate to Google Cloud\n        uses: google-github-actions/auth@v3\n        with:\n          project_id: ${{ secrets.GCP_PROJECT_ID }}\n          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}\n          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}\n      - name: Install runtime\n        run: python -m pip install --disable-pip-version-check google-auth google-api-python-client\n      - name: Enforce zero paid AI\n        run: python cost_guard.py\n      - name: Compile sender\n        run: python -m py_compile ssot_outbound_worker.py\n      - name: Send prepared canary\n        run: python ssot_outbound_worker.py\n