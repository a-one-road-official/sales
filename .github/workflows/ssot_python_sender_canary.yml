name: SSOT Python sender canary

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Comma-separated SSOT row numbers; blank uses queue"
        required: false
        default: ""
      limit:
        description: "Maximum external attempts"
        required: false
        default: "1"
  push:
    branches: [feat/ssot-python-sender-20260921]
    paths:
      - ".github/ssot-python-sender-trigger"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ssot-python-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      LEAD_FACTORY_GMAIL_IMPERSONATE: admin@a1-road.com
      LEAD_FACTORY_GMAIL_SIGNING_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      LEAD_FACTORY_TASKS_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      SSOT_OUTBOUND_ONLY_ROWS: ${{ inputs.rows || '5137' }}
      SSOT_OUTBOUND_LIMIT: ${{ inputs.limit || '1' }}
      SSOT_OUTBOUND_SEND_SPACING_SECONDS: "5"
      LEAD_FACTORY_VERTEX_ALLOWED: "FALSE"
      LEAD_FACTORY_GEMINI_ALLOWED: "FALSE"
      LEAD_FACTORY_OPENAI_ALLOWED: "FALSE"
      LEAD_FACTORY_PAID_AI_BUDGET_USD: "0"

    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check google-auth google-api-python-client
      - name: Enforce zero paid AI
        run: python cost_guard.py
      - name: Compile sender
        run: python -m py_compile ssot_outbound_worker.py
      - name: Send prepared canary
        run: python ssot_outbound_worker.py
