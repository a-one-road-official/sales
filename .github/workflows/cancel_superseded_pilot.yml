name: Cancel superseded sacrifice pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel_superseded_pilot.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stop pilot before replacing inadequate copy generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 35294497856 --repo "${GITHUB_REPOSITORY}"
