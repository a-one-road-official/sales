name: Export MAKTEK 2026 exhibitors

on:
  push:
    paths:
      - '.github/workflows/maktek-export.yml'
      - 'tools/maktek_export.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exporter dependencies
        run: pip install requests beautifulsoup4

      - name: Export complete directory
        run: python tools/maktek_export.py

      - name: Publish CSV on dedicated data branch
        run: |
          mkdir -p /tmp/maktek-export
          cp maktek_2026.csv /tmp/maktek-export/maktek_2026.csv
          cp maktek_2026.json /tmp/maktek-export/maktek_2026.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan maktek-data
          git rm -rf .
          cp /tmp/maktek-export/maktek_2026.csv maktek_2026.csv
          cp /tmp/maktek-export/maktek_2026.json maktek_2026.json
          git add maktek_2026.csv maktek_2026.json
          git commit -m "Refresh MAKTEK 2026 full exhibitor export"
          git push --force origin maktek-data

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: maktek-2026-full-export
          path: |
            /tmp/maktek-export/maktek_2026.json
            /tmp/maktek-export/maktek_2026.csv
          if-no-files-found: error
          retention-days: 7
