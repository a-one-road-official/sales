name: Deploy paused SSOT history repair
# A1 repair redeploy: central Status guard + action ledger + Gmail backfill policy.
# DeployNow: account permissions and eight-product catalog, 2026-09-17.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-paused-ssot-history-repair
  cancel-in-progress: true

jobs:
  deploy-paused:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      SERVICE: aone-lead-factory
      RUNTIME_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4

      - name: Mandatory zero paid AI budget gate
        run: python cost_guard.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and test
        run: |
          python -m compileall .
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Keep all autonomous execution paused
        run: |
          set -u
          for JOB in $(gcloud scheduler jobs list --location="$REGION" --project="$PROJECT" --format='value(name)' --filter='name:lead-factory' | sed 's#.*/##'); do
            [ -n "$JOB" ] || continue
            gcloud scheduler jobs pause "$JOB" --location="$REGION" --project="$PROJECT" || true
          done

          # Pause queues when this deployment principal has permission. If not,
          # the application-level zero-cost middleware ACK-quarantines stale task
          # deliveries with HTTP 200 before any worker/Sheets/network/model work.
          for QUEUE in lead-factory-workers lead-factory-priority-workers; do
            gcloud tasks queues pause "$QUEUE" --location="$REGION" --project="$PROJECT" || true
          done

      - name: Build paused repair image
        run: |
          set -euo pipefail
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          docker build -t "$IMAGE" .

          # Prove the image itself serves the shallow health endpoint before any
          # Cloud Run mutation. This catches app/CMD/import regressions locally.
          CID="$(docker run -d -p 18080:8080             -e LEAD_FACTORY_PAID_CLOUD_ALLOWED=FALSE             -e LEAD_FACTORY_PAID_AI_ALLOWED=FALSE             -e LEAD_FACTORY_VERTEX_ALLOWED=FALSE             -e LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED=FALSE             "$IMAGE")"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:18080/healthz; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs "$CID" || true
              exit 1
            fi
            sleep 1
          done
          docker rm -f "$CID" >/dev/null 2>&1 || true
          trap - EXIT

          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy code with every execution gate closed
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --timeout=540 \
            --memory=2Gi \
            --concurrency=1 \
            --min=0 \
            --max=1 \
            --cpu-throttling \
            --update-env-vars="LEAD_FACTORY_PAID_CLOUD_ALLOWED=FALSE,LEAD_FACTORY_PAID_AI_ALLOWED=FALSE,LEAD_FACTORY_ENABLED=FALSE,LEAD_FACTORY_AUTONOMY_MODE=PAUSED,LEAD_FACTORY_VERTEX_ALLOWED=FALSE,LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED=FALSE,LEAD_FACTORY_AUTONOMOUS_CAPACITY_EXPANSION=FALSE,LEAD_FACTORY_AUTO_ROLLOVER_DAILY_GOAL=FALSE,LEAD_FACTORY_ALLOW_HTTP_SELF_FALLBACK=FALSE,LEAD_FACTORY_ALLOW_EXTERNAL_WRITE=FALSE,LEAD_FACTORY_LIST_ONLY_LOCK=TRUE,LEAD_FACTORY_HUMAN_REVIEW_ENABLED=FALSE,LEAD_FACTORY_SEND_MODE=DISABLED,LEAD_FACTORY_EXPLICIT_SEND_APPROVAL=FALSE,LEAD_FACTORY_FACTORY_SEND_ENABLED=FALSE,OUTREACH_AUTOPILOT_ENABLED=FALSE,OUTREACH_AUTOPILOT_AUTOSTART=FALSE,OUTREACH_FACTORY_SEND_ENABLED=FALSE,OUTREACH_SSOT_SEND_ENABLED=FALSE,OUTREACH_BPO_SEND_ENABLED=FALSE,OUTREACH_SACRIFICE_SEND_ENABLED=FALSE,OUTREACH_SALES_GTM_SEND_ENABLED=FALSE,CRM_EVIDENCE_ALLOW_STATUS_WRITE=FALSE" \
            --project="$PROJECT"

      - name: Verify paused production revision
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE"             --region="$REGION" --project="$PROJECT"             --format=json > /tmp/service.json

          python - <<'PY'
          import json, os
          d = json.load(open("/tmp/service.json"))
          status = d.get("status", {})
          conditions = {x.get("type"): x.get("status") for x in status.get("conditions", [])}
          container = d.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [{}])[0]
          env = {x.get("name"): x.get("value", "") for x in container.get("env", [])}
          required_false = [
              "LEAD_FACTORY_PAID_CLOUD_ALLOWED",
              "LEAD_FACTORY_PAID_AI_ALLOWED",
              "LEAD_FACTORY_VERTEX_ALLOWED",
              "LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED",
              "LEAD_FACTORY_AUTONOMOUS_CAPACITY_EXPANSION",
              "LEAD_FACTORY_AUTO_ROLLOVER_DAILY_GOAL",
              "LEAD_FACTORY_ALLOW_HTTP_SELF_FALLBACK",
              "CRM_EVIDENCE_ALLOW_STATUS_WRITE",
          ]
          bad = {k: env.get(k) for k in required_false if str(env.get(k, "")).upper() != "FALSE"}
          expected = os.environ["GITHUB_SHA"]
          image = str(container.get("image", ""))
          print(json.dumps({
              "latestReadyRevisionName": status.get("latestReadyRevisionName"),
              "conditions": conditions,
              "image": image,
              "required_false": {k: env.get(k) for k in required_false},
          }, indent=2))
          if conditions.get("Ready") != "True":
              raise SystemExit("cloud_run_not_ready")
          if expected not in image:
              raise SystemExit("cloud_run_not_on_current_main_sha")
          if bad:
              raise SystemExit("zero_cost_env_verification_failed:" + repr(bad))
          PY

          python - <<'PY' >/tmp/run_urls.txt
          import json
          d=json.load(open("/tmp/service.json"))
          urls=[]
          status=d.get("status",{})
          if status.get("url"):
              urls.append(status["url"])
          ann=d.get("metadata",{}).get("annotations",{})
          try:
              urls.extend(json.loads(ann.get("run.googleapis.com/urls","[]")))
          except Exception:
              pass
          seen=[]
          for u in urls:
              if u and u not in seen:
                  seen.append(u)
          print("\n".join(seen))
          PY

          HEALTH_OK=0
          while IFS= read -r URL; do
            [ -n "$URL" ] || continue
            echo "Probing $URL/healthz"
            if curl --fail --silent --show-error --max-time 15 "$URL/healthz"; then
              HEALTH_OK=1
              break
            fi
          done </tmp/run_urls.txt

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Direct run.app probes returned frontend errors. The exact image already passed local /healthz before deploy."
          fi

          echo "Queue states:"
          for QUEUE in lead-factory-workers lead-factory-priority-workers; do
            gcloud tasks queues describe "$QUEUE" --location="$REGION" --project="$PROJECT"               --format='value(name,state)' || true
          done

          echo "Zero-cost production revision is Ready, on the current main SHA, and all paid execution flags are closed."
