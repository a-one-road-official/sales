name: EC sacrifice canary (Vertex-free, one batch of ten)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ec-sacrifice-canary
  cancel-in-progress: false

jobs:
  send:
    # A push can enter this job only through an intentionally named release commit.
    # All ordinary main pushes remain inert. workflow_dispatch is explicit as well.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'RUN_EC_SACRIFICE_SEND') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      RUNTIME_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      OPENAI_SECRET: aone-openai-api-key
      SPREADSHEET_ID: 1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo
      DRIVE_ROOT_FOLDER_ID: 14JY0cfJrNM9uteVmPOQ-SDoYKkSrEX3E
      SACRIFICE_SERVICE: aone-sacrifice-canary-${{ github.run_id }}
      TARGET_COMPANIES: "Algolia|Bluecore|Nosto|Tidio|Talon.One|Stackline|Gorgias|Zonos|Zoovu|Salsify|Bloomreach|Klaviyo"
      TOTAL_TARGET_COUNT: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and focused tests
        run: |
          set -euo pipefail
          python -m compileall .
          pip install -r requirements.txt
          pytest -q             tests/test_outreach_execution.py             tests/test_sales_leads_sacrifice.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Grant isolated runtime JWT signing permission
        run: |
          set -euo pipefail
          gcloud iam service-accounts add-iam-policy-binding "${RUNTIME_SA}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/iam.serviceAccountTokenCreator" \
            --project="${PROJECT}"
      - name: Generate isolated runtime token
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"
          echo "SACRIFICE_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"

      - name: Configure Docker and build image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          gcloud artifacts repositories describe aone-lead-factory             --location="${REGION}" --project="${PROJECT}" >/dev/null 2>&1 ||             gcloud artifacts repositories create aone-lead-factory               --repository-format=docker --location="${REGION}" --project="${PROJECT}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy isolated EC runtime
        run: |
          set -euo pipefail
          gcloud run deploy "${SACRIFICE_SERVICE}"             --image="${IMAGE}"             --region="${REGION}"             --platform=managed             --service-account="${RUNTIME_SA}"             --allow-unauthenticated             --timeout=540             --memory=2Gi             --cpu=2             --concurrency=1             --min=0             --max=1             --cpu-throttling             --update-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT},GCP_PROJECT=${PROJECT},LEAD_FACTORY_SPREADSHEET_ID=${SPREADSHEET_ID},LEAD_FACTORY_DRIVE_ROOT_FOLDER_ID=${DRIVE_ROOT_FOLDER_ID},LEAD_FACTORY_OPENAI_SECRET=${OPENAI_SECRET},LEAD_FACTORY_INTERNAL_TOKEN=${SACRIFICE_TOKEN},LEAD_FACTORY_GMAIL_IMPERSONATE=admin@a1-road.com,LEAD_FACTORY_GMAIL_SIGNING_SERVICE_ACCOUNT=${RUNTIME_SA},LEAD_FACTORY_TASKS_SERVICE_ACCOUNT=${RUNTIME_SA},LEAD_FACTORY_DRIVE_IMPERSONATE=admin@a1-road.com,LEAD_FACTORY_SACRIFICE_SOURCE_PATH=/app/data/sales_leads_ec_sacrifice_verified.json,OUTREACH_SACRIFICE_TARGET_COMPANIES=${TARGET_COMPANIES},LEAD_FACTORY_VERTEX_ALLOWED=FALSE,LEAD_FACTORY_ENABLED=FALSE,LEAD_FACTORY_ALLOW_EXTERNAL_WRITE=TRUE,LEAD_FACTORY_LIST_ONLY_LOCK=FALSE,LEAD_FACTORY_SEND_MODE=ENABLED,LEAD_FACTORY_EXPLICIT_SEND_APPROVAL=TRUE,LEAD_FACTORY_ISOLATED_SACRIFICE_RUNTIME=TRUE,OUTREACH_ALLOWED_LANES=EC_SACRIFICE,OUTREACH_SACRIFICE_LANES=EC_SACRIFICE,OUTREACH_SACRIFICE_SEND_ENABLED=TRUE,OUTREACH_DETERMINISTIC_DRAFT=TRUE,OUTREACH_FORM_AUDIT_TEMPLATE_ONLY=TRUE,OUTREACH_SITE_MAX_PAGES=1,OUTREACH_AUTOFIX_GENERATION=FALSE,OUTREACH_AUTOPILOT_ENABLED=FALSE,LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED=FALSE,LEAD_FACTORY_FACTORY_SEND_ENABLED=FALSE,OUTREACH_FACTORY_SEND_ENABLED=FALSE,OUTREACH_BPO_SEND_ENABLED=FALSE,OUTREACH_SALES_GTM_SEND_ENABLED=FALSE,OUTREACH_SSOT_SEND_ENABLED=FALSE,LEAD_FACTORY_DIRECT_ADAPTER_FALLBACK_ENABLED=TRUE,LEAD_FACTORY_SHEETS_READ_MIN_INTERVAL_SECONDS=1.05,LEAD_FACTORY_SHEETS_READ_CACHE_TTL_SECONDS=10,LEAD_FACTORY_SHEETS_WRITE_MIN_INTERVAL_SECONDS=1.05"             --project="${PROJECT}"
          URL="$(gcloud run services describe "${SACRIFICE_SERVICE}"             --region="${REGION}" --project="${PROJECT}" --format='value(status.url)')"
          test -n "${URL}"
          echo "SACRIFICE_URL=${URL}" >> "${GITHUB_ENV}"

      - name: Verify runtime interlocks
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 10 --retry-all-errors --retry-delay 3             -H "X-Aone-Internal-Token: ${SACRIFICE_TOKEN}"             -o /tmp/deep-health.json             "${SACRIFICE_URL}/healthz/deep"
          python - <<'PY'
          import json
          data = json.load(open("/tmp/deep-health.json", encoding="utf-8"))
          assert data["ok"] is True, data
          assert data["vertex_allowed"] is False, data
          assert data["gemini_vertex_ready"] is False, data
          assert data["external_write"] is True, data
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          curl --fail-with-body --retry 10 --retry-all-errors --retry-delay 3             -H "X-Aone-Internal-Token: ${SACRIFICE_TOKEN}"             "${SACRIFICE_URL}/outreach/prompt-status"

      - name: Execute exactly one EC sacrifice batch
        run: |
          set -euo pipefail
          BATCH_ID="ec-sacrifice-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BODY="$(python - "${BATCH_ID}" <<'PY'
          import json
          import sys
          print(json.dumps({
              "limit": 10,
              "execute_external": True,
              "lane": "EC_SACRIFICE",
              "batch_id": sys.argv[1],
          }))
          PY
          )"
          curl --fail-with-body --max-time 1200 --retry 1 --retry-all-errors --retry-delay 4             -X POST             -H "X-Aone-Internal-Token: ${SACRIFICE_TOKEN}"             -H "Content-Type: application/json"             --data "${BODY}"             -o /tmp/ec-sacrifice-result.json             "${SACRIFICE_URL}/outreach/sales-leads-sacrifice-run"
          cat /tmp/ec-sacrifice-result.json
          python - <<'PY'
          import json
          from collections import Counter
          data = json.load(open("/tmp/ec-sacrifice-result.json", encoding="utf-8"))
          assert data.get("lane") == "EC_SACRIFICE", data
          assert data.get("send_enabled") is True, data
          results = data.get("results") or []
          assert len(results) <= 10, data
          statuses = Counter(str(row.get("status") or "UNKNOWN") for row in results)
          print("batch_id=", data.get("batch_id"))
          print("attempted=", data.get("attempted"))
          print("statuses=", dict(statuses))
          for row in results:
              execution = row.get("execution") or row.get("form_execution") or {}
              print({
                  "company_name": row.get("company_name"),
                  "status": row.get("status"),
                  "recipient": (row.get("audit") or {}).get("recipient") or execution.get("recipient"),
                  "reason": execution.get("reason") or row.get("error_message") or row.get("stage"),
              })
          PY

      - name: Upload per-attempt audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ec-sacrifice-canary-${{ github.run_id }}
          path: /tmp/ec-sacrifice-result.json
          if-no-files-found: ignore

      - name: Delete isolated runtime
        if: ${{ always() }}
        run: |
          gcloud run services delete "${SACRIFICE_SERVICE}"             --region="${REGION}" --project="${PROJECT}" --quiet || true
