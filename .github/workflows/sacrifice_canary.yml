name: EC outbound batch (manual gated)

on:
  workflow_dispatch:
    inputs:
      execute_ec:
        description: "Run exactly one 10-company EC/retail batch"
        required: true
        type: boolean
        default: false
      batch_id:
        description: "Optional idempotent batch identifier"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ec-outbound-batch
  cancel-in-progress: false

jobs:
  send:
    # Two independent gates: an explicit manual run input and repository
    # approval variables. Pushes and ordinary deploys cannot enter this job.
    if: ${{ inputs.execute_ec == true && vars.LEAD_FACTORY_SEND_MODE == 'ENABLED' && vars.LEAD_FACTORY_EXPLICIT_SEND_APPROVAL == 'TRUE' }}
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      SERVICE: aone-ec-${{ github.run_id }}
      RUNTIME_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      OPENAI_SECRET: aone-openai-api-key
      BATCH_ID_INPUT: ${{ inputs.batch_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m compileall .
          pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Generate internal runtime token
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "INTERNAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Enable required APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            sheets.googleapis.com \
            drive.googleapis.com \
            --project="$PROJECT"

      - name: Configure Docker auth and registry
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          gcloud artifacts repositories describe aone-lead-factory \
            --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || \
          gcloud artifacts repositories create aone-lead-factory \
            --repository-format=docker \
            --location="$REGION" \
            --description="A-one Lead Factory images" \
            --project="$PROJECT"

      - name: Build and push the same runtime image
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy isolated EC runner with the shared sender
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --timeout=540 \
            --concurrency=1 \
            --min=0 \
            --max=1 \
            --update-env-vars="^|^GOOGLE_CLOUD_PROJECT=${PROJECT}|GCP_PROJECT=${PROJECT}|LEAD_FACTORY_SPREADSHEET_ID=1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo|LEAD_FACTORY_DRIVE_ROOT_FOLDER_ID=14JY0cfJrNM9uteVmPOQ-SDoYKkSrEX3E|LEAD_FACTORY_DRIVE_SCRAPERS_FOLDER_ID=1c5vE9oAGMXn209JKIyGonJ7pZ4-1bplk|LEAD_FACTORY_OPENAI_SECRET=${OPENAI_SECRET}|LEAD_FACTORY_INTERNAL_TOKEN=${INTERNAL_TOKEN}|LEAD_FACTORY_DRIVE_IMPERSONATE=admin@a1-road.com|LEAD_FACTORY_GMAIL_IMPERSONATE=admin@a1-road.com|OUTREACH_PROMPT_DOC_TITLE=outreach_prompt_production_v1|LEAD_FACTORY_ALLOW_EXTERNAL_WRITE=TRUE|LEAD_FACTORY_SEND_MODE=ENABLED|LEAD_FACTORY_EXPLICIT_SEND_APPROVAL=TRUE|OUTREACH_ALLOWED_LANES=EC_SACRIFICE|OUTREACH_SACRIFICE_LANES=EC_SACRIFICE|OUTREACH_SACRIFICE_SEND_ENABLED=TRUE|OUTREACH_FACTORY_SEND_ENABLED=FALSE|OUTREACH_SSOT_SEND_ENABLED=FALSE|LEAD_FACTORY_FACTORY_SEND_ENABLED=FALSE|OUTREACH_READY_ENABLED=FALSE|LEAD_FACTORY_ALLOW_DELETE=FALSE|LEAD_FACTORY_INTERNAL_NOTIFY_ENABLED=FALSE|LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED=FALSE|LEAD_FACTORY_SHEETS_READ_MIN_INTERVAL_SECONDS=0.5|LEAD_FACTORY_SHEETS_READ_CACHE_TTL_SECONDS=10|LEAD_FACTORY_SHEETS_WRITE_MIN_INTERVAL_SECONDS=0.25" \
            --project="$PROJECT"
          URL="$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT" --format='value(status.url)')"
          test -n "$URL"
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"

      - name: Execute exactly one 10-company EC batch
        run: |
          set -euo pipefail
          BATCH_ID="${BATCH_ID_INPUT:-ec-${GITHUB_RUN_ID}}"
          PAYLOAD="$(BATCH_ID="$BATCH_ID" python -c 'import json,os; print(json.dumps({"limit":10,"batch_id":os.environ["BATCH_ID"],"dry_run":False}))')"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 540 \
            -X POST \
            -H "X-Aone-Internal-Token: $INTERNAL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$SERVICE_URL/outreach/sales-leads-sacrifice-run")"
          printf '%s' "$RESPONSE" > /tmp/ec-batch-response.json
          python -c 'import json; d=json.load(open("/tmp/ec-batch-response.json")); a=int(d.get("attempted",0) or 0); s=int(d.get("success_count",0) or 0); print({"batch_id":d.get("batch_id"),"attempted":a,"success_count":s,"failure_count":d.get("failure_count"),"external_action":d.get("external_action")}); assert a == 10, d; assert s >= 5, d'

      - name: Clean up the isolated EC runner
        if: ${{ always() }}
        run: |
          gcloud run services delete "$SERVICE" \
            --region="$REGION" --project="$PROJECT" --quiet || true
