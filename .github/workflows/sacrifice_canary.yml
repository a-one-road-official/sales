name: Execute EC sacrifice canary

on:
  workflow_dispatch:
    inputs:
      execute_sacrifice:
        description: "Run one explicitly approved ten-company EC/retail send batch"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ec-sacrifice-canary
  cancel-in-progress: false

jobs:
  sacrifice:
    if: ${{ inputs.execute_sacrifice == true && vars.LEAD_FACTORY_SEND_MODE == 'ENABLED' && vars.LEAD_FACTORY_EXPLICIT_SEND_APPROVAL == 'TRUE' }}
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      RUNTIME_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      OPENAI_SECRET: aone-openai-api-key
      SPREADSHEET_ID: 1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo
      SACRIFICE_SERVICE: aone-sacrifice-${{ github.run_id }}
      SACRIFICE_TOKEN: ${{ secrets.LEAD_FACTORY_SACRIFICE_INTERNAL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker and build image
        run: |
          set -euo pipefail
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          gcloud artifacts repositories describe aone-lead-factory --location="${REGION}" --project="${PROJECT}" >/dev/null 2>&1 ||             gcloud artifacts repositories create aone-lead-factory --repository-format=docker --location="${REGION}" --project="${PROJECT}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy isolated EC sender
        run: |
          set -euo pipefail
          test -n "${SACRIFICE_TOKEN}"
          gcloud run deploy "${SACRIFICE_SERVICE}"             --image="${IMAGE}"             --region="${REGION}"             --platform=managed             --service-account="${RUNTIME_SA}"             --allow-unauthenticated             --timeout=540             --concurrency=1             --min=1             --max=1             --no-cpu-throttling             --update-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT},GCP_PROJECT=${PROJECT},LEAD_FACTORY_SPREADSHEET_ID=${SPREADSHEET_ID},LEAD_FACTORY_OPENAI_SECRET=${OPENAI_SECRET},LEAD_FACTORY_INTERNAL_TOKEN=${SACRIFICE_TOKEN},LEAD_FACTORY_GMAIL_IMPERSONATE=admin@a1-road.com,LEAD_FACTORY_DRIVE_IMPERSONATE=admin@a1-road.com,LEAD_FACTORY_ALLOW_EXTERNAL_WRITE=FALSE,LEAD_FACTORY_FACTORY_SEND_ENABLED=FALSE,OUTREACH_FACTORY_SEND_ENABLED=FALSE,OUTREACH_SACRIFICE_SEND_ENABLED=TRUE,LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED=FALSE,LEAD_FACTORY_DIRECT_ADAPTER_FALLBACK_ENABLED=TRUE,LEAD_FACTORY_SHEETS_READ_MIN_INTERVAL_SECONDS=0.5,LEAD_FACTORY_SHEETS_READ_CACHE_TTL_SECONDS=10,LEAD_FACTORY_SHEETS_WRITE_MIN_INTERVAL_SECONDS=0.25             --project="${PROJECT}"
          URL="$(gcloud run services describe "${SACRIFICE_SERVICE}" --region="${REGION}" --project="${PROJECT}" --format='value(status.url)')"
          test -n "${URL}"
          echo "SACRIFICE_URL=${URL}" >> "${GITHUB_ENV}"
          curl --fail-with-body --retry 10 --retry-all-errors --retry-delay 3             -H "X-Aone-Internal-Token: ${SACRIFICE_TOKEN}" "${URL}/healthz/deep"

      - name: Execute exactly ten EC/retail attempts
        run: |
          set +e
          BATCH_ID="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          successes=0
          failures=0
          for N in $(seq 1 10); do
            BODY="$(python - "${BATCH_ID}" "${N}" <<'PY'
          import json, sys
          print(json.dumps({
              "limit": 1,
              "execute_external": True,
              "batch_id": sys.argv[1],
              "batch_slot": int(sys.argv[2]) - 1,
          }))
          PY
            )"
            OUT="/tmp-ec-sacrifice-${N}.json"
            HTTP="$(curl --silent --show-error --fail-with-body --max-time 180 --retry 1 --retry-all-errors --retry-delay 4               --write-out '%{http_code}' -X POST               -H "X-Aone-Internal-Token: ${SACRIFICE_TOKEN}"               -H "Content-Type: application/json"               --data "${BODY}" -o "${OUT}" "${SACRIFICE_URL}/outreach/sales-leads-sacrifice-run")"
            STATUS="$(python - "${OUT}" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
              rows = data.get("results") or []
              print(rows[0].get("status", "REQUEST_FAILED") if rows else "REQUEST_FAILED")
          except Exception:
              print("REQUEST_FAILED")
          PY
            )"
            echo "slot=${N} status=${STATUS} http=${HTTP}"
            if [ "${STATUS}" = "SENT" ] || [ "${STATUS}" = "FORM_SENT" ]; then
              successes=$((successes + 1))
            else
              failures=$((failures + 1))
            fi
            sleep 2
          done
          echo "attempted=10 successes=${successes} failures=${failures}"
          if [ "${successes}" -lt 5 ]; then
            exit 1
          fi

      - name: Remove isolated sender after batch
        if: ${{ always() }}
        run: |
          gcloud run services delete "${SACRIFICE_SERVICE}"             --region="${REGION}" --project="${PROJECT}" --quiet || true
