name: EC sacrifice batch (Playwright-only; Vertex forbidden)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight checks access/schema; execute may research, append to sacrifice, and submit public forms"
        required: true
        type: choice
        options:
          - preflight
          - execute
        default: preflight
      manifest:
        description: "bounded JSON manifest path"
        required: true
        type: string
        default: data/sacrifice_oss_campaign.json
  push:
    branches: [main]
    paths:
      - ".github/ec-playwright-trigger"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ec-sacrifice-playwright
  cancel-in-progress: false

jobs:
  sacrifice:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'RUN_EC_PLAYWRIGHT') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SACRIFICE_SPREADSHEET_ID: 1QBZKoN82O-SrFUnWaHBQtvflcdMT1gDp-QMPtZvLsEk
      LEAD_FACTORY_VERTEX_ALLOWED: FALSE
      OUTREACH_SITE_FETCH_MODE: PLAYWRIGHT
      OUTREACH_SITE_RPS: "0.5"
      OUTREACH_PLAYWRIGHT_FORM_ONLY: "TRUE"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install isolated OSS runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-sacrifice.txt
          python -m playwright install --with-deps chromium

      - name: Verify this lane cannot call Vertex
        run: |
          set -euo pipefail
          if rg -n --glob '*.py' 'google\.genai|google\.generativeai|vertexai|aiplatform' \
            sacrifice_sheet_pipeline.py sacrifice_web_research.py browser_fetch.py form_execution.py sales_leads_sacrifice.py; then
            echo "forbidden paid AI import found"
            exit 1
          fi
          python -m py_compile sacrifice_sheet_pipeline.py sacrifice_web_research.py browser_fetch.py form_execution.py sales_leads_sacrifice.py

      - name: Preflight exact sacrifice workbook and schema
        run: |
          set -euo pipefail
          python sacrifice_sheet_pipeline.py --preflight

      - name: Execute bounded research, append, and public-form outreach
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'execute' }}
        env:
          SACRIFICE_EXPLICIT_SEND_APPROVAL: TRUE
          MANIFEST_PATH: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          python sacrifice_sheet_pipeline.py --execute --manifest "${MANIFEST_PATH}"

      - name: Upload bounded result audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ec-sacrifice-${{ github.run_id }}
          path: sacrifice-result.json
          if-no-files-found: ignore
