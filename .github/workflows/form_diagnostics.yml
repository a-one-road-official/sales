name: Read-only form diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/form-diagnostic-trigger"

permissions:
  contents: read

concurrency:
  group: form-diagnostics
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Compile + resilience tests
        run: |
          python -m compileall form_execution.py form_production.py tools/form_probe.py
          pytest -q tests/test_form_execution_resilience.py
      - name: Probe difficult forms read-only
        run: python tools/form_probe.py | tee form-probe-result.json
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-probe-${{ github.run_id }}
          path: form-probe-result.json
          if-no-files-found: warn
          retention-days: 3
