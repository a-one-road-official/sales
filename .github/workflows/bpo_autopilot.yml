name: Retired legacy BPO control

# Retained as a tombstone so an old operator link cannot launch a global stop.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject retired control explicitly
        run: |
          echo 'This control is retired. Use sacrifice_canary.yml for approved free outreach.'
          echo 'Use emergency-cost-stop.yml only for an explicit paid-AI stop.'
          exit 1
