name: BPO outbound autopilot (manual start, durable 10-batch loop)

on:
  workflow_dispatch:
    inputs:
      execute_bpo:
        description: "Start the approved BPO outbound autopilot"
        required: true
        default: false
        type: boolean
      target_successes:
        description: "Successful BPO sends required before completion"
        required: true
        default: "2500"
        type: string
      max_attempts:
        description: "Maximum unique send attempts before source-capacity stop"
        required: true
        default: "4000"
        type: string
      job_id:
        description: "Optional idempotent job identifier"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: lead-factory-bpo-autopilot
  cancel-in-progress: false

jobs:
  bpo-autopilot:
    if: ${{ inputs.execute_bpo == true && vars.LEAD_FACTORY_SEND_MODE == 'ENABLED' && vars.LEAD_FACTORY_EXPLICIT_SEND_APPROVAL == 'TRUE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      SERVICE: aone-bpo-autopilot-${{ github.run_id }}
      RUNTIME_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      OPENAI_SECRET: aone-openai-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python compile check
        run: python -m compileall .

      - name: Run tests
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Generate internal runtime token
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "INTERNAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Configure Docker auth
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push the shared application image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy isolated BPO runtime
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/aone-lead-factory/aone-lead-factory:${GITHUB_SHA}"
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --timeout=540 \
            --concurrency=1 \
            --min=1 \
            --max=1 \
            --no-cpu-throttling \
            --update-env-vars="^|^GOOGLE_CLOUD_PROJECT=${PROJECT}|GCP_PROJECT=${PROJECT}|LEAD_FACTORY_SPREADSHEET_ID=1SSg8qB_N1wUESnAyCwTaEB5hgvS6jDJB8Bh2ryoO9mo|LEAD_FACTORY_DRIVE_ROOT_FOLDER_ID=14JY0cfJrNM9uteVmPOQ-SDoYKkSrEX3E|LEAD_FACTORY_DRIVE_SCRAPERS_FOLDER_ID=1c5vE9oAGMXn209JKIyGonJ7pZ4-1bplk|LEAD_FACTORY_OPENAI_SECRET=${OPENAI_SECRET}|LEAD_FACTORY_INTERNAL_TOKEN=${INTERNAL_TOKEN}|LEAD_FACTORY_DRIVE_IMPERSONATE=admin@a1-road.com|LEAD_FACTORY_GMAIL_IMPERSONATE=admin@a1-road.com|OUTREACH_PROMPT_DOC_TITLE=outreach_prompt_production_v1|LEAD_FACTORY_ALLOW_EXTERNAL_WRITE=TRUE|LEAD_FACTORY_SEND_MODE=ENABLED|LEAD_FACTORY_GMAIL_MODE=SEND|LEAD_FACTORY_EXPLICIT_SEND_APPROVAL=TRUE|OUTREACH_ALLOWED_LANES=BPO|OUTREACH_SACRIFICE_LANES=BPO|OUTREACH_BPO_SEND_ENABLED=TRUE|OUTREACH_SACRIFICE_SEND_ENABLED=FALSE|OUTREACH_FACTORY_SEND_ENABLED=FALSE|OUTREACH_SSOT_SEND_ENABLED=FALSE|LEAD_FACTORY_FACTORY_SEND_ENABLED=FALSE|OUTREACH_AUTOPILOT_ENABLED=TRUE|OUTREACH_BPO_TARGET_SUCCESS=${{ inputs.target_successes }}|OUTREACH_BPO_MAX_ATTEMPTS=${{ inputs.max_attempts }}|OUTREACH_STABLE_BATCHES_REQUIRED=3|OUTREACH_STABLE_BATCH_MIN_SUCCESS=5|OUTREACH_CRITICAL_ERROR_RESETS=TRUE|OUTREACH_AUTONOMY_SUPERVISOR_ENABLED=FALSE|LEAD_FACTORY_ALLOW_DELETE=FALSE|LEAD_FACTORY_INTERNAL_NOTIFY_ENABLED=FALSE|LEAD_FACTORY_AUTONOMY_SUPERVISOR_ENABLED=FALSE|LEAD_FACTORY_SHEETS_READ_MIN_INTERVAL_SECONDS=0.5|LEAD_FACTORY_SHEETS_READ_CACHE_TTL_SECONDS=10|LEAD_FACTORY_SHEETS_WRITE_MIN_INTERVAL_SECONDS=0.25" \
            --project="$PROJECT"
          URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT" --format='value(status.url)')"
          test -n "$URL"
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"

      - name: Verify BPO runtime gate
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            "${SERVICE_URL}/healthz/deep"
          echo "BPO is enabled; Factory and SSOT sends are disabled."

      - name: Start one durable BPO job
        env:
          JOB_INPUT: ${{ inputs.job_id }}
          TARGET_INPUT: ${{ inputs.target_successes }}
          MAX_INPUT: ${{ inputs.max_attempts }}
        run: |
          set -euo pipefail
          JOB_ID="$JOB_INPUT"
          if [ -z "$JOB_ID" ]; then JOB_ID="bpo-auto-${GITHUB_RUN_ID}"; fi
          PAYLOAD="$(JOB_ID="$JOB_ID" TARGET_INPUT="$TARGET_INPUT" MAX_INPUT="$MAX_INPUT" python -c 'import json,os; print(json.dumps({"job_id":os.environ["JOB_ID"],"lane":"BPO","target_successes":int(os.environ["TARGET_INPUT"]),"max_attempts":int(os.environ["MAX_INPUT"]),"stable_batches_required":3,"minimum_successes":5}))')"
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${SERVICE_URL}/outreach/bpo-autopilot/start" \
            -o /tmp/bpo-start.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/bpo-start.json").read_text())
          print(json.dumps(result, ensure_ascii=False, indent=2))
          assert result.get("lane") == "BPO", result
          assert result.get("accepted") is True, result
          PY

      - name: Wait for durable BPO autopilot
        run: |
          set -euo pipefail
          for attempt in $(seq 1 720); do
            curl --fail-with-body --silent --show-error --max-time 60 \
              -H "X-Aone-Internal-Token: ${INTERNAL_TOKEN}" \
              "${SERVICE_URL}/outreach/bpo-autopilot/status" \
              -o /tmp/bpo-status.json
            STATUS="$(python -c 'import json; print(json.load(open("/tmp/bpo-status.json")).get("status", "UNKNOWN"))')"
            python -m json.tool /tmp/bpo-status.json | tail -80
            case "$STATUS" in
              COMPLETED_TARGET)
                exit 0
                ;;
              SOURCE_CAPACITY_SHORTFALL|SOURCE_EXHAUSTED|TARGET_NOT_REACHED|FAILED|BLOCKED|PAUSED_SAFETY|STOPPED)
                echo "BPO autopilot ended with status=$STATUS" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "BPO autopilot polling timed out" >&2
          exit 1

      - name: Delete isolated BPO runtime
        if: ${{ always() }}
        run: |
          gcloud run services delete "$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT" \
            --quiet || true
