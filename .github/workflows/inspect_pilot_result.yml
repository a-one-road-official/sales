name: Inspect sacrifice pilot result
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect_pilot_result.yml']
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read exact completed pilot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35295267817 --repo "${GITHUB_REPOSITORY}" --name sacrifice-bulk-35295267817 --dir audit
          cat audit/outreach-evidence/EC_SACRIFICE-001-batch.json
          cat audit/runtime.log
